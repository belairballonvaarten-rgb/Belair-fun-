<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Belair-Fun — Planning</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1E2227">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Belair-Fun">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#1E2227;
  --panel:#282D34;
  --panel-alt:#313742;
  --line:#3A4048;
  --text:#F1EFE9;
  --text-dim:#9BA2AC;
  --accent:#E8631E;
  --accent-dim:#B94F19;
  --ok:#2F9E7A;
  --wacht:#3B82F6;
  --warn:#D9A441;
  --danger:#D2564F;
  --radius:4px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding-bottom:76px;
  position:relative;
}
h1,h2,h3,.label-font{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  letter-spacing:0.2px;
}
/* Header */
.topbar{
  background:var(--panel);
  border-bottom:2px solid var(--accent);
  padding:16px 18px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.topbar .brand{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:22px;
  color:var(--text);
  display:flex;
  align-items:baseline;
  gap:6px;
}
.topbar .brand .dot{color:var(--accent);}
.topbar .sub{font-size:12px;color:var(--text-dim);margin-top:1px;}

main{flex:1;padding:16px;}

/* Bottom nav */
.tabbar{
  position:fixed;
  bottom:0;left:0;right:0;
  max-width:520px;
  margin:0 auto;
  background:var(--panel);
  border-top:1px solid var(--line);
  display:flex;
  z-index:20;
}
.tabbar button{
  flex:1;
  background:none;
  border:none;
  color:var(--text-dim);
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;
  font-weight:600;
  padding:12px 4px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
  border-top:2px solid transparent;
}
.tabbar button.active{color:var(--accent);border-top-color:var(--accent);}
.tabbar svg{width:20px;height:20px;}

/* Delivery list */
.section-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;
  color:var(--text-dim);
  margin:14px 2px 8px;
  display:flex;align-items:center;gap:6px;
}
.section-label::before{content:'';width:8px;height:8px;border-radius:50%;display:inline-block;}
.section-label.te-leveren-label::before{background:var(--accent);}
.section-label.op-te-halen-label::before{background:var(--wacht);}
.section-label.afgerond-label::before{background:var(--ok);}
.next-pickup-banner{
  background:rgba(59,130,246,0.12);
  border:1px solid rgba(59,130,246,0.4);
  color:var(--wacht);
  font-size:13px;font-weight:600;
  padding:10px 12px;border-radius:var(--radius);
  margin-bottom:12px;
}
.reorder-row{display:flex;gap:6px;margin-top:8px;}
.reorder-btn{
  background:var(--panel-alt);border:1px solid var(--line);color:var(--text-dim);
  width:30px;height:26px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;
}
.reorder-btn:active{background:var(--line);}
.star-badge{color:var(--warn);font-size:14px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-title{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;text-transform:capitalize;}
.cal-nav{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--panel-alt);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;font-size:20px;color:var(--text-dim);}
.cal-nav:active{background:var(--line);}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text-dim);margin-bottom:6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);font-size:13px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:600;}
.cal-cell.cal-empty{cursor:default;background:none;}
.cal-cell.cal-free{background:rgba(47,158,122,0.16);color:var(--ok);}
.cal-cell.cal-active{background:rgba(210,86,79,0.28);color:#ff9a94;}
.cal-cell.cal-today{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;}
.cal-cell.cal-selected{box-shadow:inset 0 0 0 2px #fff;}
.cal-legend{display:flex;align-items:center;font-size:11.5px;color:var(--text-dim);margin-top:12px;}
.cal-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;}
.cal-dot.cal-free{background:var(--ok);}
.cal-dot.cal-active{background:#ff9a94;}
.card-delete-btn{
  color:var(--danger);font-size:15px;
  width:26px;height:26px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.brand-logo-img{max-height:30px;max-width:170px;display:block;object-fit:contain;}
.day-group{margin-bottom:22px;}
.day-group h2{
  font-size:16px;
  color:var(--accent);
  margin:0 0 8px 2px;
  text-transform:uppercase;
  font-size:13px;
  letter-spacing:0.6px;
}
.card{
  background:var(--panel);
  border-left:3px solid var(--line);
  border-radius:0 var(--radius) var(--radius) 0;
  padding:12px 14px;
  margin-bottom:10px;
  cursor:pointer;
  position:relative;
}
.card.status-te-leveren{border-left-color:var(--accent);}
.card.status-geplaatst{border-left-color:var(--wacht);}
.card.status-afgerond{border-left-color:var(--ok);opacity:0.72;}
.card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.card .klant{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;}
.card .tijd{font-size:13px;color:var(--text-dim);white-space:nowrap;}
.card .adres{font-size:13px;color:var(--text-dim);margin-top:2px;}
.badge{
  display:inline-block;
  font-size:11px;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  padding:2px 8px;
  border-radius:10px;
  margin-top:6px;
  letter-spacing:0.3px;
}
.badge.te-leveren{background:rgba(232,99,30,0.18);color:var(--accent);}
.badge.geplaatst{background:rgba(59,130,246,0.18);color:var(--wacht);}
.badge.afgerond{background:rgba(47,158,122,0.18);color:var(--ok);}

.card.card-mine{border-left-color:var(--accent);background:linear-gradient(90deg, rgba(232,99,30,0.08), var(--panel) 40%);}
.assign-badge{
  font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:600;
  padding:2px 8px;border-radius:10px;letter-spacing:0.3px;
}
.assign-badge.mine{background:var(--accent);color:#fff;}
.assign-badge.other{background:var(--panel-alt);color:var(--text-dim);}
.assign-badge.open{background:var(--panel-alt);color:var(--text-dim);}
.empty{
  text-align:center;
  color:var(--text-dim);
  padding:60px 20px;
  font-size:14px;
}
.empty .big{font-family:'Barlow Condensed',sans-serif;font-size:20px;color:var(--text);margin-bottom:6px;}

/* Buttons */
button{font-family:'Inter',sans-serif;}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:var(--radius);
  padding:13px 16px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  width:100%;
}
.btn:active{background:var(--accent-dim);}
.btn.secondary{background:var(--panel-alt);color:var(--text);border:1px solid var(--line);}
.btn.ok{background:var(--ok);}
.btn.ghost{background:none;color:var(--accent);padding:10px 4px;width:auto;}
.btn.danger{background:none;border:1px solid var(--danger);color:var(--danger);}
.btn.danger:active{background:rgba(210,86,79,0.12);}
.btn.small{padding:9px 12px;font-size:13px;width:auto;}
.btn:disabled{opacity:0.45;cursor:default;}

/* Detail view */
.back{
  display:flex;align-items:center;gap:6px;
  color:var(--text-dim);
  font-size:14px;
  cursor:pointer;
  margin-bottom:12px;
}
.detail-head{margin-bottom:14px;}
.detail-head .klant{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;}
.detail-head .adres{color:var(--text-dim);font-size:14px;margin-top:2px;}
.detail-head .meta{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--text-dim);}

.section{
  background:var(--panel);
  border-radius:var(--radius);
  border:1px solid var(--line);
  padding:14px 16px;
  margin-bottom:14px;
}
.section h3{
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--text-dim);
  margin:0 0 12px 0;
}
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:5px;}
.field input[type=text],.field input[type=tel],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea{
  width:100%;
  background:var(--panel-alt);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:var(--radius);
  padding:10px 11px;
  font-size:14px;
  font-family:'Inter',sans-serif;
}
.field textarea{resize:vertical;min-height:64px;}

.check-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  gap:12px;
}
.check-row:last-child{border-bottom:none;}
.check-row .txt{font-size:14px;}
.check-row .sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.toggle{
  width:46px;height:27px;
  background:var(--panel-alt);
  border:1px solid var(--line);
  border-radius:14px;
  position:relative;
  cursor:pointer;
  flex-shrink:0;
}
.toggle .knob{
  position:absolute;top:2px;left:2px;
  width:21px;height:21px;
  border-radius:50%;
  background:var(--text-dim);
  transition:left .15s, background .15s;
}
.toggle.on{background:rgba(47,158,122,0.25);border-color:var(--ok);}
.toggle.on .knob{left:21px;background:var(--ok);}

.pillgroup{display:flex;gap:8px;flex-wrap:wrap;}
.pill{
  padding:8px 13px;
  border-radius:16px;
  border:1px solid var(--line);
  background:var(--panel-alt);
  color:var(--text-dim);
  font-size:13px;
  cursor:pointer;
}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.waze-btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  background:#33ccff;
  color:#0a2733;
  font-weight:700;
  border-radius:var(--radius);
  padding:14px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:17px;
  cursor:pointer;
  border:none;
  width:100%;
}

.photos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;background:var(--panel-alt);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .rm{
  position:absolute;top:3px;right:3px;
  background:rgba(0,0,0,0.6);color:#fff;
  border-radius:50%;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;cursor:pointer;
}
.add-photo{
  aspect-ratio:1;border-radius:var(--radius);
  border:1.5px dashed var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:26px;cursor:pointer;
}

.statusbar-select{margin-bottom:14px;}
.statusbar-select select{
  width:100%;background:var(--panel-alt);border:1px solid var(--line);color:var(--text);
  padding:10px;border-radius:var(--radius);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;
}

.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--ok);color:#fff;padding:10px 18px;border-radius:20px;
  font-size:13px;font-weight:600;z-index:50;
  opacity:0;pointer-events:none;transition:opacity .2s, bottom .2s;
}
.toast.show{opacity:1;bottom:100px;}

.stack{display:flex;flex-direction:column;gap:10px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.locked-block{opacity:0.5;pointer-events:none;user-select:none;}
.locked-banner{
  display:flex;align-items:center;gap:6px;
  background:rgba(47,158,122,0.12);
  border:1px solid rgba(47,158,122,0.4);
  color:var(--ok);
  font-size:12.5px;font-weight:600;
  padding:8px 11px;border-radius:var(--radius);
  margin-bottom:12px;
}
.queue-note{
  background:var(--panel-alt);
  border:1px dashed var(--line);
  color:var(--text-dim);
  font-size:12.5px;
  padding:10px 12px;
  border-radius:var(--radius);
  text-align:center;
}
.auth-wrap{
  max-width:360px;margin:0 auto;
  min-height:100vh;
  display:flex;flex-direction:column;justify-content:center;
  padding:24px;
}
.auth-wrap .field{margin-bottom:12px;}
.auth-wrap .error{
  color:var(--danger);font-size:13px;margin:-4px 0 12px;min-height:16px;
}
.auth-wrap .switch-link{
  text-align:center;color:var(--text-dim);font-size:13px;margin-top:14px;cursor:pointer;
}
.auth-wrap .switch-link b{color:var(--accent);font-weight:600;}
.user-chip{
  display:flex;align-items:center;gap:8px;
  font-size:12.5px;color:var(--text-dim);
}
.user-chip .logout{color:var(--accent);cursor:pointer;font-weight:600;}
.mini-row{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.mini-row:last-child{border-bottom:none;}
.mini-row-title{font-size:14px;}
.mini-row-type{font-size:11px;color:var(--text-dim);margin-left:4px;}
.mini-row-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.driver-block{border-bottom:1px solid var(--line);padding:10px 0;}
.driver-block:last-child{border-bottom:none;}
.driver-block summary{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  list-style:none;
}
.driver-block summary::-webkit-details-marker{display:none;}
.driver-count{font-family:'Inter',sans-serif;font-weight:400;font-size:12px;color:var(--text-dim);}
.team-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line);
}
.team-row:last-child{border-bottom:none;}
.team-row .naam{font-size:14px;}
.team-row .rolbadge{font-size:11px;color:var(--text-dim);margin-top:2px;}
.team-row .rm{color:var(--danger);font-size:12px;cursor:pointer;}
.note-banner{
  background:rgba(217,164,65,0.12);
  border:1px solid rgba(217,164,65,0.4);
  border-radius:var(--radius);
  padding:10px 12px;
  font-size:12.5px;
  color:var(--warn);
  margin-bottom:14px;
  line-height:1.4;
}

/* Tablet en groter: gebruik meer van de beschikbare breedte */
@media (min-width: 700px){
  #app, .tabbar{ max-width:760px; }
  main{ padding:22px 28px; }
  .photos-grid{ grid-template-columns:repeat(4,1fr); }
  #locations-map{ height:360px !important; }
  .tabbar button{ font-size:16px; padding:14px 4px 12px; }
  .card{ padding:16px 18px; }
}
@media (min-width: 1000px){
  #app, .tabbar{ max-width:920px; }
  .photos-grid{ grid-template-columns:repeat(6,1fr); }
  #locations-map{ height:420px !important; }
}
</style>
</head>
<body>
<div id="authScreen" style="display:none">
  <div class="auth-wrap">
    <div class="brand-wrap" style="margin-bottom:4px">
      <img src="/logo.png" alt="Belair-Fun" class="brand-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='';">
      <div class="brand" style="font-size:28px;display:none">Belair<span class="dot">·</span>Fun</div>
    </div>
    <div id="authSub" class="sub" style="margin-bottom:22px">Planning &amp; overzicht</div>
    <div id="authForm"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div>
      <img src="/logo.png" alt="Belair-Fun" class="brand-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='';">
      <div class="brand" style="display:none">Belair<span class="dot">·</span>Fun</div>
      <div class="sub" id="topbarSub">Planning</div>
    </div>
    <div id="topbarAction"></div>
  </div>
  <main id="main"></main>
  <div class="tabbar">
    <button data-tab="list" class="tab-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      Planning
    </button>
    <button data-tab="new" class="tab-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Nieuw
    </button>
    <button data-tab="dossiers" class="tab-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 9h16"/></svg>
      Overzicht
    </button>
    <button data-tab="team" class="tab-btn" id="teamTabBtn" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Team
    </button>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
// ---------- State ----------
let deliveries = [];
let view = 'list';
let currentId = null;
let checklistMode = 'plaatsing'; // 'plaatsing' | 'afhaling'
let busy = false;

const STATUS_LABEL = {
  'te-leveren': 'Te leveren',
  'geplaatst': 'Geplaatst — wacht op afhaling',
  'afgerond': 'Afgerond'
};

// ---------- Auth state ----------
let authToken = localStorage.getItem('bf-token') || null;
let currentUser = null;
let authMode = 'login'; // 'login' | 'setup'
const persistedIds = new Set();

async function apiFetch(path, opts){
  opts = opts || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if(authToken) headers['Authorization'] = 'Bearer ' + authToken;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if(res.status === 401 && path !== '/api/login' && path !== '/api/setup'){
    doLogout();
    throw new Error('Sessie verlopen, log opnieuw in');
  }
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((body && body.error) || 'Er ging iets mis');
  return body;
}

function doLogout(reload){
  stopLocationSharing();
  authToken = null; currentUser = null;
  localStorage.removeItem('bf-token');
  if(reload !== false) showAuthScreen();
}

// ---------- Data helpers (via API) ----------
async function loadDeliveries(){
  deliveries = await apiFetch('/api/deliveries');
  persistedIds.clear();
  deliveries.forEach(d => persistedIds.add(d.id));
}
async function saveDeliveries(d){
  if(!d) return;
  if(persistedIds.has(d.id)){
    await apiFetch('/api/deliveries/' + d.id, { method:'PUT', body: JSON.stringify(d) });
  }else{
    await apiFetch('/api/deliveries', { method:'POST', body: JSON.stringify(d) });
    persistedIds.add(d.id);
  }
}

// ---------- Utilities ----------
function uid(){ return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('nl-BE', { weekday:'short', day:'numeric', month:'short' });
}
function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function normalizeOndergrond(v){
  if(!v) return '';
  const s = String(v).toLowerCase();
  if(s.includes('hard')) return 'Harde ondergrond';
  if(s.includes('gras') || s.includes('grass')) return 'Op gras';
  return v;
}

    toegewezenAanAfhaling: null, // { id, naam } chauffeur voor afhaling, apart van levering

    afhaling: {

function fmtDateTime(iso){

// ---------- Routing / render ----------
function setView(v, id){
  view = v;
  currentId = id || null;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === v || (v==='detail' && b.dataset.tab==='list'));
  });
  render();
}

function render(){
  const main = document.getElementById('main');
  const sub = document.getElementById('topbarSub');
  const action = document.getElementById('topbarAction');
  action.innerHTML = `<div class="user-chip">${escapeHtml(currentUser ? currentUser.naam : '')}<span class="logout" id="logout-btn">Uitloggen</span></div>`;
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=> doLogout());

  try{
    if(view === 'list'){
      sub.textContent = 'Planning';
      main.innerHTML = renderList();
      bindListEvents();
    } else if(view === 'new'){
      sub.textContent = 'Nieuwe levering';
      main.innerHTML = renderNewForm();
      bindNewFormEvents();
    } else if(view === 'dossiers'){
      sub.textContent = 'Overzicht';
      main.innerHTML = renderDossiers();
      bindDossierEvents();
    } else if(view === 'team'){
      sub.textContent = 'Team';
      main.innerHTML = renderTeam();
      Promise.resolve(bindTeamEvents()).catch(err=>{
        console.error('Fout bij laden van Team-gegevens:', err);
        showToast('Fout bij laden Team: ' + err.message);
      });
    } else if(view === 'detail'){
      const d = getDelivery(currentId);
      if(!d){ setView('list'); return; }
      sub.textContent = d.klant || 'Levering';
      main.innerHTML = renderDetail(d);
      bindDetailEvents(d);
    }
  }catch(err){
    console.error('Render-fout bij view "' + view + '":', err);
    main.innerHTML = `<div class="section" style="border-color:var(--danger)">
      <h3 style="color:var(--danger)">Er ging iets mis bij het tonen van dit scherm</h3>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px">Maak hier een screenshot van en stuur die door:</div>
      <div style="font-family:monospace;font-size:11.5px;white-space:pre-wrap;background:var(--panel-alt);padding:10px;border-radius:var(--radius);color:var(--danger)">${escapeHtml(view + ': ' + (err && err.stack ? err.stack : String(err)))}</div>
    </div>`;
  }
}

  </div>`;

let perDriverDate = todayISO();
function renderUnassigned(){
  const openLeveringen = deliveries.filter(d => d.status === 'te-leveren' && !d.toegewezenAan && d.datum === perDriverDate)
    .sort((a,b)=> sortKeyFor(a,'tijdslot') - sortKeyFor(b,'tijdslot'));
  const openAfhalingen = deliveries.filter(d => d.status !== 'afgerond' && !d.toegewezenAanAfhaling && (d.afhaaldatum || d.datum) === perDriverDate)
    .sort((a,b)=> sortKeyFor(a,'afhaaltijd') - sortKeyFor(b,'afhaaltijd'));
  if(openLeveringen.length === 0 && openAfhalingen.length === 0){
    return `<div class="queue-note" style="text-align:left">✓ Niets onbeheerd op deze dag.</div>`;
  }
  let html = '';
  if(openLeveringen.length){
    html += `<div class="section-label te-leveren-label" style="margin-top:0">Leveringen zonder chauffeur (${openLeveringen.length})</div>`;
    html += openLeveringen.map(d => miniRow(d, 'Levering')).join('');
  }
  if(openAfhalingen.length){
    html += `<div class="section-label op-te-halen-label">Afhalingen zonder chauffeur (${openAfhalingen.length})</div>`;
    html += openAfhalingen.map(d => miniRow(d, 'Afhaling')).join('');
  }
  return html;
}
function renderPerDriver(){
  if(teamUsers.length === 0) return 'Nog geen teamleden.';
  const blocks = teamUsers.map(u=>{
    const leveringen = deliveries.filter(d => d.toegewezenAan && d.toegewezenAan.id === u.id && d.datum === perDriverDate)
      .sort((a,b)=> sortKeyFor(a,'tijdslot') - sortKeyFor(b,'tijdslot'));
    const afhalingen = deliveries.filter(d => d.toegewezenAanAfhaling && d.toegewezenAanAfhaling.id === u.id && (d.afhaaldatum || d.datum) === perDriverDate)
      .sort((a,b)=> sortKeyFor(a,'afhaaltijd') - sortKeyFor(b,'afhaaltijd'));
    const totaal = leveringen.length + afhalingen.length;
    if(totaal === 0) return '';
    const afgerond = leveringen.filter(d=>d.status==='afgerond').length + afhalingen.filter(d=>d.status==='afgerond').length;
    return `<details class="driver-block" open>
      <summary>${escapeHtml(u.naam)} <span class="driver-count">${afgerond}/${totaal} afgerond</span></summary>
      ${leveringen.length ? `<div class="section-label te-leveren-label">Leveringen</div>${leveringen.map(d=>miniRow(d,'Levering')).join('')}` : ''}
      ${afhalingen.length ? `<div class="section-label op-te-halen-label">Afhalingen</div>${afhalingen.map(d=>miniRow(d,'Afhaling')).join('')}` : ''}
    </details>`;
  }).filter(Boolean);
  if(blocks.length === 0){
    return `<div class="queue-note" style="text-align:left">Niemand heeft die dag iets gepland.</div>`;
  }
  return blocks.join('');
}

let locationsMap = null;
let locationMarkers = [];
function timeAgo(iso){
  const diffMin = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if(diffMin < 1) return 'net nu';
  if(diffMin < 60) return diffMin + ' min geleden';
  const h = Math.round(diffMin/60);
  return h + ' u geleden';
}
async function loadDriverLocations(){
  const listEl = document.getElementById('locations-list');
  const mapEl = document.getElementById('locations-map');
  if(!listEl || !mapEl) return;
  let locs;
  try{ locs = await apiFetch('/api/locations'); }
  catch(err){ listEl.textContent = err.message; return; }

  try{
    if(typeof L === 'undefined'){
      mapEl.textContent = 'Kaart kon niet geladen worden (probeer de pagina te herladen).';
    } else {
      if(locationsMap){
        locationsMap.remove();
        locationsMap = null;
      }
      locationsMap = L.map('locations-map', { attributionControl: false }).setView([50.98, 4.05], 8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(locationsMap);
      locationMarkers = [];
    }
  }catch(err){
    console.error('Kaart laden mislukt:', err);
    mapEl.textContent = 'Kaart kon niet geladen worden.';
  }

  if(locs.length === 0){
    listEl.textContent = 'Nog geen chauffeur heeft de app recent open gehad.';
  } else {
    listEl.innerHTML = locs.map(l => `<div>📍 ${escapeHtml(l.naam)} — ${timeAgo(l.updated_at)}</div>`).join('');
    if(locationsMap){
      try{
        const bounds = [];
        locs.forEach(l=>{
          const marker = L.marker([l.lat, l.lng]).addTo(locationsMap)
            .bindPopup(escapeHtml(l.naam) + '<br>' + timeAgo(l.updated_at));
          locationMarkers.push(marker);
          bounds.push([l.lat, l.lng]);
        });
        if(bounds.length) locationsMap.fitBounds(bounds, { padding: [30,30], maxZoom: 14 });
      }catch(err){ console.error('Pinnen plaatsen mislukt:', err); }
    }
  }
  setTimeout(()=> locationsMap && locationsMap.invalidateSize(), 100);
}
async function refreshTeamList(){
  const el = document.getElementById('team-list');
  try{
    teamUsers = await apiFetch('/api/users');
    assignableUsers = teamUsers;
  }catch(err){ el.textContent = err.message; return; }
  if(teamUsers.length === 0){ el.textContent = 'Nog geen teamleden.'; return; }
  el.innerHTML = teamUsers.map(u => `

      </div>
      ${u.id !== currentUser.id ? `<span class="rm" data-id="${u.id}">Verwijderen</span>` : ''}
    </div>

  el.querySelectorAll('.rm').forEach(btn=>{

    });

let listFilter = 'alle'; // 'alle' | 'mij'
let typeFilter = 'alle'; // 'alle' | 'leveringen' | 'afhalingen'
let renderedSections = {}; // sectionKey -> geordende array van delivery-ids (voor omhoog/omlaag knoppen)

function timeMinutes(str){
  if(!str) return null;
  const m = String(str).match(/(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function sortKeyFor(d, timeField){
  if(d.handmatigeVolgorde != null) return d.handmatigeVolgorde;
  const mins = timeMinutes(d[timeField]);
  return 100000 + (mins != null ? mins : 9999);
}
function primaryProductLabel(d){
  const items = (d.artikelen||'').split(/[\n,+]/).map(s=>s.trim()).filter(Boolean);
  if(items.length === 0) return d.klant || 'Naamloos';
  return items[0] + (items.length > 1 ? ', ...' : '');
}

function relevantDateForItem(d){
  return (d.status === 'geplaatst' || d.status === 'afgerond') ? (d.afhaaldatum || d.datum) : d.datum;
}
function weekCutoffISO(){
  const d = new Date();
  d.setDate(d.getDate() + 6);
  return d.toISOString().slice(0,10);
}
function renderList(){
  const filterBar = `
    <div class="pillgroup" id="list-filter-pills" style="margin-bottom:10px">
      <span class="pill ${listFilter==='alle'?'active':''}" data-val="alle">Alles</span>
      <span class="pill ${listFilter==='mij'?'active':''}" data-val="mij">Voor mij</span>
    </div>
    <div class="pillgroup" id="type-filter-pills" style="margin-bottom:16px">
      <span class="pill ${typeFilter==='alle'?'active':''}" data-val="alle">Alles</span>
      <span class="pill ${typeFilter==='leveringen'?'active':''}" data-val="leveringen">Leveringen</span>
      <span class="pill ${typeFilter==='afhalingen'?'active':''}" data-val="afhalingen">Afhalingen</span>
    </div>
    ${currentUser.rol !== 'admin' ? `<div class="queue-note" style="margin-bottom:16px;text-align:left">Je ziet hier de planning tot en met de komende week. Voor de volledige planning: vraag de admin.</div>` : ''}
  `;
  let visible = listFilter === 'mij'
    ? deliveries.filter(d =>
        (d.toegewezenAan && d.toegewezenAan.id === currentUser.id) ||
        (d.toegewezenAanAfhaling && d.toegewezenAanAfhaling.id === currentUser.id))
    : deliveries;

  if(currentUser.rol !== 'admin'){
    const cutoff = weekCutoffISO();
    visible = visible.filter(d => {
      const datum = relevantDateForItem(d);
      return !datum || datum <= cutoff;
    });
  }

  if(deliveries.length === 0){
    return `<div class="empty">
      <div class="big">Nog geen leveringen</div>
      Voeg een levering toe via "Nieuw" onderaan.
    </div>`;
  }
  if(visible.length === 0){
    return filterBar + `<div class="empty"><div class="big">Niets gevonden</div>Bekijk "Alles" of vraag de admin naar de volledige planning.</div>`;
  }

  renderedSections = {};
  const groups = {};
  visible.forEach(d=>{
    const key = (d.status === 'geplaatst' || d.status === 'afgerond') ? (d.afhaaldatum || d.datum || 'Onbekend') : (d.datum || 'Onbekend');
    if(!groups[key]) groups[key] = [];
    groups[key].push(d);
  });

  let html = filterBar;
  let anyDayShown = false;
  Object.keys(groups).sort().forEach(dateKey=>{
    const items = groups[dateKey];
    let teLeveren = items.filter(d => d.status === 'te-leveren').sort((a,b)=> sortKeyFor(a,'tijdslot') - sortKeyFor(b,'tijdslot'));
    let opTeHalen = items.filter(d => d.status === 'geplaatst').sort((a,b)=> sortKeyFor(a,'afhaaltijd') - sortKeyFor(b,'afhaaltijd'));
    let afgerond = items.filter(d => d.status === 'afgerond').sort((a,b)=> sortKeyFor(a,'afhaaltijd') - sortKeyFor(b,'afhaaltijd'));

    if(typeFilter === 'leveringen'){ opTeHalen = []; afgerond = []; }
    if(typeFilter === 'afhalingen'){ teLeveren = []; afgerond = []; }

    if(teLeveren.length === 0 && opTeHalen.length === 0 && afgerond.length === 0) return;
    anyDayShown = true;

    const teLeverenKey = dateKey + '|te-leveren';
    const opTeHalenKey = dateKey + '|geplaatst';
    renderedSections[teLeverenKey] = teLeveren.map(d=>d.id);
    renderedSections[opTeHalenKey] = opTeHalen.map(d=>d.id);

    html += `<div class="day-group"><h2>${dateKey===todayISO() ? 'Vandaag — ' : ''}${fmtDate(dateKey)}</h2>`;

    if(typeFilter !== 'leveringen' && teLeveren.length === 0 && opTeHalen.length > 0){
      const eerste = opTeHalen[0];
      html += `<div class="next-pickup-banner">🕐 Alle leveringen gebeurd — eerstvolgende afhaling: <b>${escapeHtml(eerste.afhaaltijd || '?')} bij ${escapeHtml(eerste.klant)}</b></div>`;
    }

    if(teLeveren.length){
      html += `<div class="section-label te-leveren-label">Te leveren</div>`;
      teLeveren.forEach(d => html += cardHtml(d, teLeverenKey));
    }
    if(opTeHalen.length){
      html += `<div class="section-label op-te-halen-label">Op te halen</div>`;
      opTeHalen.forEach(d => html += cardHtml(d, opTeHalenKey));
    }
    if(afgerond.length){
      html += `<div class="section-label afgerond-label">Afgerond</div>`;
      afgerond.forEach(d => html += cardHtml(d, ''));
    }
    html += `</div>`;
  });
  if(!anyDayShown){
    html += `<div class="empty"><div class="big">Niets gevonden</div>Probeer een andere filtercombinatie.</div>`;
  }
  return html;
}
async function requestDeleteDelivery(id, klant){
  if(!confirm('Reservatie van ' + (klant||'deze klant') + ' definitief verwijderen? Dit kan niet ongedaan gemaakt worden.')) return false;
  try{
    await apiFetch('/api/deliveries/' + id, { method:'DELETE' });
    const idx = deliveries.findIndex(x => x.id === id);
    if(idx !== -1) deliveries.splice(idx,1);
    persistedIds.delete(id);
    showToast('Reservatie verwijderd');
    return true;
  }catch(err){
    showToast(err.message);
    return false;
  }
}
function moveCard(sectionKey, id, dir){
  const order = renderedSections[sectionKey];
  if(!order) return;
  const idx = order.indexOf(id);
  const swapWith = dir === 'up' ? idx - 1 : idx + 1;
  if(idx < 0 || swapWith < 0 || swapWith >= order.length) return;
  [order[idx], order[swapWith]] = [order[swapWith], order[idx]];
  const changed = [];
  order.forEach((did, i)=>{
    const d = getDelivery(did);
    if(d && d.handmatigeVolgorde !== i){
      d.handmatigeVolgorde = i;
      changed.push(d);
    }
  });
  render();
  Promise.all(changed.map(d => saveDeliveries(d).catch(err=>showToast(err.message))));
}
function bindListEvents(){
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=> setView('detail', c.dataset.id));
  });
  document.querySelectorAll('.card-delete-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const deleted = await requestDeleteDelivery(btn.dataset.deleteId, btn.dataset.deleteNaam);
      if(deleted) render();
    });
  });
  document.querySelectorAll('.reorder-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const sectionKey = btn.closest('.reorder-row').dataset.section;
      if(!sectionKey) return;
      moveCard(sectionKey, btn.dataset.id, btn.dataset.dir);
    });
  });
  const filterPills = document.getElementById('list-filter-pills');
  if(filterPills){
    filterPills.querySelectorAll('.pill').forEach(p=>{
      p.addEventListener('click', ()=>{
        listFilter = p.dataset.val;
        render();
      });
    });
  }
  const typePills = document.getElementById('type-filter-pills');
  if(typePills){
    typePills.querySelectorAll('.pill').forEach(p=>{
      p.addEventListener('click', ()=>{
        typeFilter = p.dataset.val;
        render();
      });
    });
  }
}

function bindNewFormEvents(){
  const importBtn = document.getElementById('import-btn');
  if(importBtn){
    importBtn.addEventListener('click', ()=> document.getElementById('import-file').click());
    document.getElementById('import-file').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const resultEl = document.getElementById('import-result');
      resultEl.textContent = 'Bezig met importeren...';
      try{
        const fileBase64 = await new Promise((resolve, reject)=>{
          const reader = new FileReader();
          reader.onload = ()=> resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const r = await apiFetch('/api/import', { method:'POST', body: JSON.stringify({ fileBase64 }) });
        let msg = r.imported + ' nieuwe levering(en) toegevoegd';
        if(r.updated) msg += ', ' + r.updated + ' bestaande bijgewerkt (via boekingsnummer)';
        msg += '.';
        if(r.skipped && r.skipped.length){
          msg += ' ' + r.skipped.length + ' rij(en) overgeslagen: ' + r.skipped.map(s=>'rij '+s.rij+' ('+s.reden+')').join(', ');
        }
        resultEl.textContent = msg;
        showToast('Import voltooid');
        await loadDeliveries();
      }catch(err){
        resultEl.textContent = 'Import mislukt: ' + err.message;
      }
      e.target.value = '';
    });
  }

  document.getElementById('save-new').addEventListener('click', async ()=>{
    const klant = document.getElementById('f-klant').value.trim();
    const adres = document.getElementById('f-adres').value.trim();
    if(!klant || !adres){ showToast('Naam en adres zijn verplicht'); return; }
    const d = emptyDelivery();
    d.klant = klant;
    d.telefoon = document.getElementById('f-telefoon').value.trim();
    d.email = document.getElementById('f-email').value.trim();
    d.adres = adres;
    d.datum = document.getElementById('f-datum').value || todayISO();
    d.tijdslot = document.getElementById('f-tijdslot').value.trim();
    d.artikelen = document.getElementById('f-artikelen').value.trim();
    d.afhaaldatum = document.getElementById('f-afhaaldatum').value;
    d.afhaaltijd = document.getElementById('f-afhaaltijd').value;
    d.ondergrond = document.getElementById('f-ondergrond').value;
    if(d.ondergrond === 'Harde ondergrond') d.plaatsing.valmatten = true;
    d.plaatsing.tijdstip = d.afhaaltijd;
    deliveries.push(d);
    try{
      await saveDeliveries(d);
      showToast('Levering toegevoegd');
      setView('detail', d.id);
    }catch(err){
      deliveries.pop();
      showToast(err.message);
    }
  });
}

function resizeImageFile(file, maxWidth=900, quality=0.62){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- PDF generation ----------
async function generateAndOfferPdf(d){
  if(!window.jspdf){ showToast('PDF-bibliotheek nog aan het laden, probeer opnieuw'); return; }
  const photos = await loadPhotos(d.id);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const marginL = 16;
  let y = 18;
  const pageH = doc.internal.pageSize.getHeight();
  const pageW = doc.internal.pageSize.getWidth();

  function ensureSpace(h){
    if(y + h > pageH - 16){ doc.addPage(); y = 18; }
  }
  function heading(text){
    ensureSpace(10);
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(232,99,30);
    doc.text(text, marginL, y); y += 6;
    doc.setDrawColor(232,99,30); doc.setLineWidth(0.4);
    doc.line(marginL, y-4.5, pageW-marginL, y-4.5);
    doc.setTextColor(30,30,30);
  }
  function line(label, value){
    ensureSpace(6.5);
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(label + ':', marginL, y);
    doc.setFont('helvetica','normal');
    const wrapped = doc.splitTextToSize(String(value || '—'), pageW - marginL*2 - 45);
    doc.text(wrapped, marginL + 45, y);
    y += Math.max(6, wrapped.length * 5);
  }
  function checkline(label, checked){
    line(label, checked ? 'Ja' : 'Nee');
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(30,30,30);
  doc.text('Belair-Fun', marginL, y); y += 7;
  doc.setFontSize(13); doc.setTextColor(90,90,90);
  doc.text('Plaatsingsverslag', marginL, y); y += 4;
  doc.setDrawColor(210,210,210); doc.line(marginL, y, pageW-marginL, y); y += 8;
  doc.setTextColor(30,30,30);

  heading('Klantgegevens');
  line('Dossiernummer', d.id);
  line('Klant', d.klant);
  line('Adres', d.adres);
  line('Telefoon', d.telefoon);
  line('E-mail', d.email);
  line('Leverdatum', fmtDate(d.datum) + (d.tijdslot ? ' — ' + d.tijdslot : ''));
  line('Artikelen', d.artikelen);
  if(d.ondergrond) line('Ondergrond', normalizeOndergrond(d.ondergrond));
  if(d.bedrag) line('Te ontvangen', '€ ' + d.bedrag);
  y += 2;

  heading('Afhaling');
  line('Afhaaldatum', d.afhaaldatum ? fmtDate(d.afhaaldatum) : '—');
  line('Afhaaltijd', d.afhaaltijd || '—');
  y += 2;

  heading('Checklist bij plaatsing');
  checkline('Springkasteel correct geplaatst', d.plaatsing.correctGeplaatst);
  line('Bevestiging', bevestigingLabel(d.plaatsing.bevestiging) || (d.plaatsing.bevestiging === 'geen' ? 'Geen' : '—'));
  checkline('Valmatten gebruikt', d.plaatsing.valmatten);
  checkline('Verlengkabel gebruikt', d.plaatsing.verlengkabel);
  if(d.plaatsing.verlengkabel) line('Aantal verlengkabels', d.plaatsing.aantalKabels || '—');
  checkline('Nette staat achtergelaten', d.plaatsing.netjes);
  line('Opmerkingen', d.plaatsing.opmerkingen || '—');
  y += 2;

  const betalingLabel = { 'voldaan-cash':'Voldaan (cash ter plaatse)', 'voldaan-overschrijving':'Voldaan via overschrijving', 'factuur':'Factuur wordt opgemaakt' }[d.betaling.status] || '—';
  heading('Betaling');
  line('Status', betalingLabel);
  line('Opmerking', d.betaling.opmerking || '—');
  y += 2;

  const hasAfhalingData = d.afhaling.valmattenTerug || d.afhaling.kabelsTerug || d.afhaling.bevestigingTerug || d.afhaling.natOfVuil || d.afhaling.reinigingNodig || d.afhaling.opmerkingen;
  if(hasAfhalingData){
    heading('Checklist bij afhaling');
    if(d.plaatsing.valmatten) checkline('Valmatten terug mee', d.afhaling.valmattenTerug);
    if(d.plaatsing.verlengkabel) checkline('Verlengkabel terug mee', d.afhaling.kabelsTerug);
    if(d.plaatsing.bevestiging && d.plaatsing.bevestiging !== 'geen') checkline(bevestigingLabel(d.plaatsing.bevestiging) + ' terug mee', d.afhaling.bevestigingTerug);
    checkline('Kasteel nat of vuil', d.afhaling.natOfVuil);
    checkline('Reiniging nodig', d.afhaling.reinigingNodig);
    line('Opmerkingen', d.afhaling.opmerkingen || '—');
    y += 2;
  }

  if(photos.length){
    heading('Foto\'s');
    const thumbW = (pageW - marginL*2 - 8) / 3;
    const thumbH = thumbW * 0.75;
    let col = 0;
    photos.forEach((p)=>{
      ensureSpace(thumbH + 4);
      const x = marginL + col * (thumbW + 4);
      try{ doc.addImage(p.dataUrl, 'JPEG', x, y, thumbW, thumbH); }catch(err){}
      col++;
      if(col === 3){ col = 0; y += thumbH + 4; }
    });
    if(col !== 0) y += thumbH + 4;
  }

  ensureSpace(20);
  y += 4;
  doc.setDrawColor(210,210,210); doc.line(marginL, y, pageW-marginL, y); y += 6;
  doc.setFontSize(9); doc.setTextColor(140,140,140);
  doc.text('Gegenereerd op ' + new Date().toLocaleString('nl-BE', { hour12:false }), marginL, y);

  const fileName = 'plaatsingsverslag-' + (d.klant || 'klant').replace(/[^a-z0-9]+/gi,'-').toLowerCase() + '-' + d.datum + '.pdf';

  // Try native share (allows picking Mail app on mobile), fallback to download
  try{
    const blob = doc.output('blob');
    const file = new File([blob], fileName, { type: 'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Plaatsingsverslag ' + d.klant, text: 'Plaatsingsverslag Belair-Fun — ' + d.klant });
      showToast('Verslag klaar om te delen');
      return;
    }
  }catch(err){ /* user cancelled or unsupported, fall through to download */ }

  doc.save(fileName);
  showToast('PDF gedownload');
}

function dossierCardHtml(d){
  const factuurStar = (currentUser.rol === 'admin' && d.betaling.status === 'factuur') ? `<span class="star-badge" title="Nog te factureren">★</span>` : '';
  const verzetBadge = d.afhaling.verzetAangevraagd ? `<span class="assign-badge other" style="background:rgba(217,164,65,0.18);color:var(--warn)">🔁 Verzet aangevraagd</span>` : '';
  const deleteBtn = currentUser.rol === 'admin' ? `<span class="card-delete-btn" data-delete-id="${d.id}" data-delete-naam="${escapeHtml(d.klant||'')}" title="Verwijderen">✕</span>` : '';
  const stamps = [];
  if(d.plaatsing.bevestigd && d.plaatsing.bevestigdOp) stamps.push('Geleverd: ' + fmtDateTime(d.plaatsing.bevestigdOp));
  if(d.afhaling.bevestigd && d.afhaling.bevestigdOp) stamps.push('Afgehaald: ' + fmtDateTime(d.afhaling.bevestigdOp));
  return `
    <div class="card status-${d.status}" data-id="${d.id}" data-open="1">
      <div class="row1">
        <div>
          <div class="klant">${escapeHtml(primaryProductLabel(d))} ${factuurStar}</div>
          <div class="adres" style="margin-top:1px">${escapeHtml(d.klant)}</div>
        </div>
        <div style="text-align:right">
          <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
            <div class="tijd">${fmtDate(d.datum)}</div>
            ${deleteBtn}
          </div>
          ${d.ondergrond ? `<div style="font-size:11.5px;color:var(--text-dim);margin-top:4px">🌱 ${escapeHtml(normalizeOndergrond(d.ondergrond))}</div>` : ''}
          ${d.bedrag ? `<div style="font-size:11.5px;color:var(--text-dim);margin-top:2px">💶 € ${escapeHtml(d.bedrag)}</div>` : ''}
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px">
        <span class="badge ${d.status}" style="margin-top:0">${STATUS_LABEL[d.status]}</span>
        ${verzetBadge}
      </div>
      ${stamps.length ? `<div style="font-size:11.5px;color:var(--text-dim);margin-top:8px">${stamps.join(' · ')}</div>` : ''}
      <div class="stack" style="margin-top:10px">
        <button class="btn small secondary" data-pdf="${d.id}">Verslag downloaden / delen</button>
      </div>
    </div>
  `;
}

function renderDossiers(){
  const activity = activityDatesSet();
  const firstOfMonth = new Date(calYear, calMonth, 1);
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const startWeekday = (firstOfMonth.getDay() + 6) % 7; // maandag = 0

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${calYear}-${pad2(calMonth+1)}-${pad2(day)}`;
    const hasActivity = activity.has(dateStr);
    const isSelected = dateStr === calSelectedDate;
    const isToday = dateStr === todayISO();
    cells += `<div class="cal-cell ${hasActivity?'cal-active':'cal-free'} ${isSelected?'cal-selected':''} ${isToday?'cal-today':''}" data-date="${dateStr}">${day}</div>`;
  }

  const dayItems = deliveries.filter(d => d.datum === calSelectedDate || d.afhaaldatum === calSelectedDate)
    .sort((a,b)=> sortKeyFor(a, a.datum===calSelectedDate ? 'tijdslot' : 'afhaaltijd') - sortKeyFor(b, b.datum===calSelectedDate ? 'tijdslot' : 'afhaaltijd'));

  return `
  <div class="section">
    <div class="cal-header">
      <span class="cal-nav" id="cal-prev">‹</span>
      <span class="cal-title">${MAANDNAMEN[calMonth]} ${calYear}</span>
      <span class="cal-nav" id="cal-next">›</span>
    </div>
    <div class="cal-weekdays">${WEEKDAGEN.map(w=>`<div>${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend"><span class="cal-dot cal-free"></span> Geen reservaties<span class="cal-dot cal-active" style="margin-left:16px"></span> Reservaties</div>
  </div>
  <div class="section">
    <h3>${fmtDate(calSelectedDate)}</h3>
    ${dayItems.length === 0 ? `<div class="queue-note" style="text-align:left">Geen reservaties op deze dag.</div>` : dayItems.map(d => dossierCardHtml(d)).join('')}
  </div>
  `;
}
function bindDossierEvents(){
  document.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      calSelectedDate = cell.dataset.date;
      render();
    });
  });
  const calPrev = document.getElementById('cal-prev');
  if(calPrev) calPrev.addEventListener('click', ()=>{
    calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; }
    render();
  });
  const calNext = document.getElementById('cal-next');
  if(calNext) calNext.addEventListener('click', ()=>{
    calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; }
    render();
  });
  document.querySelectorAll('[data-open]').forEach(c=>{
    c.addEventListener('click', (e)=>{
      if(e.target.closest('[data-pdf]') || e.target.closest('.card-delete-btn')) return;
      setView('detail', c.dataset.id);
    });
  });
  document.querySelectorAll('.card-delete-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const deleted = await requestDeleteDelivery(btn.dataset.deleteId, btn.dataset.deleteNaam);
      if(deleted) render();
    });
  });
  document.querySelectorAll('[data-pdf]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const d = getDelivery(btn.dataset.pdf);
      if(d) await generateAndOfferPdf(d);
    });
  });
}

// ---------- Tab bar ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{

});

// ---------- Auth screens ----------
function showAuthScreen(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('authScreen').style.display = 'block';
  renderAuthForm();
}
let assignableUsers = [];
let appSettings = {};
async function showApp(){
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('teamTabBtn').style.display = (currentUser && currentUser.rol === 'admin') ? '' : 'none';
  if(currentUser && currentUser.rol === 'admin'){
    try{ assignableUsers = await apiFetch('/api/users'); }catch(e){ assignableUsers = []; }
  } else {
    startLocationSharing();
  }
  try{ appSettings = await apiFetch('/api/settings'); }catch(e){ appSettings = {}; }
  await loadDeliveries();
  setView('list');
}

// ---------- Locatie delen (enkel chauffeurs, enkel terwijl de app open/actief is) ----------
let locationWatchId = null;
let lastLocationSentAt = 0;
function startLocationSharing(){
  if(!('geolocation' in navigator) || locationWatchId !== null) return;
  locationWatchId = navigator.geolocation.watchPosition(
    (pos)=>{
      const now = Date.now();
      if(now - lastLocationSentAt < 20000) return; // max om de 20s versturen
      lastLocationSentAt = now;
      apiFetch('/api/location', {
        method: 'POST',
        body: JSON.stringify({ lat: pos.coords.latitude, lng: pos.coords.longitude })
      }).catch(()=>{});
    },
    ()=>{ /* geen toestemming of niet beschikbaar: negeren, app blijft gewoon werken */ },
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
  );
}
function stopLocationSharing(){
  if(locationWatchId !== null){
    navigator.geolocation.clearWatch(locationWatchId);
    locationWatchId = null;
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) stopLocationSharing();
  else if(currentUser && currentUser.rol !== 'admin') startLocationSharing();
});

function renderAuthForm(){
  const sub = document.getElementById('authSub');
  const form = document.getElementById('authForm');
  if(authMode === 'setup'){
    sub.textContent = 'Eerste installatie — maak het beheerdersaccount aan';
    form.innerHTML = `
      <div class="field"><label>Installatiecode</label><input type="text" id="a-setupkey" placeholder="Zoals ingesteld op de server"></div>
      <div class="field"><label>Jouw naam</label><input type="text" id="a-naam" placeholder="Bv. Jonas"></div>
      <div class="field"><label>Gebruikersnaam</label><input type="text" id="a-username" placeholder="Bv. jonas"></div>
      <div class="field"><label>Wachtwoord</label><input type="text" id="a-password" placeholder="Kies een wachtwoord"></div>
      <div class="error" id="a-error"></div>
      <button class="btn" id="a-submit">Account aanmaken</button>
    `;
    document.getElementById('a-submit').addEventListener('click', async ()=>{
      const body = {
        setupKey: document.getElementById('a-setupkey').value,
        naam: document.getElementById('a-naam').value.trim(),
        username: document.getElementById('a-username').value.trim(),
        password: document.getElementById('a-password').value
      };
      try{
        const r = await apiFetch('/api/setup', { method:'POST', body: JSON.stringify(body) });
        authToken = r.token; currentUser = r.user;
        localStorage.setItem('bf-token', authToken);
        showApp();
      }catch(err){ document.getElementById('a-error').textContent = err.message; }
    });
  } else {
    sub.textContent = 'Log in om verder te gaan';
    form.innerHTML = `
      <div class="field"><label>Gebruikersnaam</label><input type="text" id="a-username" autocomplete="username"></div>
      <div class="field"><label>Wachtwoord</label><input type="password" id="a-password" autocomplete="current-password"></div>
      <div class="error" id="a-error"></div>
      <button class="btn" id="a-submit">Inloggen</button>
    `;
    document.getElementById('a-submit').addEventListener('click', doLogin);
    document.getElementById('a-password').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') doLogin(); });
  }
}
async function doLogin(){
  const username = document.getElementById('a-username').value.trim();
  const password = document.getElementById('a-password').value;
  try{
    const r = await apiFetch('/api/login', { method:'POST', body: JSON.stringify({ username, password }) });
    authToken = r.token; currentUser = r.user;
    localStorage.setItem('bf-token', authToken);
    showApp();
  }catch(err){ document.getElementById('a-error').textContent = err.message; }
}

// ---------- Init ----------
(async function init(){
  try{
    const status = await apiFetch('/api/setup-status');
    if(status.needsSetup){
      authMode = 'setup';
      showAuthScreen();
      return;
    }
  }catch(err){
    showAuthScreen();
    document.getElementById('authForm').innerHTML = `<div class="error">Kan de server niet bereiken. Probeer de pagina te herladen.</div>`;
    return;
  }

  if(authToken){
    try{
      const r = await apiFetch('/api/me');
      currentUser = r.user;
      await showApp();
      return;
    }catch(err){ /* token ongeldig, val terug op login */ }
  }
  authMode = 'login';
  showAuthScreen();
})();
