<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Belair-Fun — Planning</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1E2227">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Belair-Fun">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#1E2227;
  --panel:#282D34;
  --panel-alt:#313742;
  --line:#3A4048;
  --text:#F1EFE9;
  --text-dim:#9BA2AC;
  --accent:#E8631E;
  --accent-dim:#B94F19;
  --ok:#2F9E7A;
  --wacht:#3B82F6;
  --warn:#D9A441;
  --danger:#D2564F;
  --radius:4px;
}
[data-theme="light"]{
  --bg:#F2F3F5;
  --panel:#FFFFFF;
  --panel-alt:#EDEFF2;
  --line:#D8DCE1;
  --text:#20242A;
  --text-dim:#5C6470;
  --accent:#E8631E;
  --accent-dim:#B94F19;
  --ok:#1F8F6B;
  --wacht:#2B6FD1;
  --warn:#B8791C;
  --danger:#C23F38;
}
[data-theme="light"] .cal-cell.cal-active{background:rgba(194,63,56,0.16);color:#A6332D;}
[data-theme="light"] .cal-dot.cal-active{background:#C23F38;}
[data-theme="light"] .cal-cell.cal-selected{box-shadow:inset 0 0 0 2px #20242A;}
[data-theme="light"] .card-delete-btn,
[data-theme="light"] .team-row .rm{color:var(--danger);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding-bottom:76px;
  position:relative;
}
h1,h2,h3,.label-font{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  letter-spacing:0.2px;
}
/* Header */
.topbar{
  background:var(--panel);
  border-bottom:2px solid var(--accent);
  padding:16px 18px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.topbar .brand{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:22px;
  color:var(--text);
  display:flex;
  align-items:baseline;
  gap:6px;
}
.topbar .brand .dot{color:var(--accent);}
.topbar .sub{font-size:12px;color:var(--text-dim);margin-top:1px;}

main{flex:1;padding:16px;}

/* Bottom nav */
.tabbar{
  position:fixed;
  bottom:0;left:0;right:0;
  max-width:520px;
  margin:0 auto;
  background:var(--panel);
  border-top:1px solid var(--line);
  display:flex;
  z-index:20;
}
.tabbar button{
  flex:1;
  background:none;
  border:none;
  color:var(--text-dim);
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;
  font-weight:600;
  padding:12px 4px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
  border-top:2px solid transparent;
}
.tabbar button.active{color:var(--accent);border-top-color:var(--accent);}
.tabbar svg{width:20px;height:20px;}

/* Delivery list */
.section-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;
  color:var(--text-dim);
  margin:14px 2px 8px;
  display:flex;align-items:center;gap:6px;
}
.section-label::before{content:'';width:8px;height:8px;border-radius:50%;display:inline-block;}
.section-label.te-leveren-label::before{background:var(--accent);}
.section-label.op-te-halen-label::before{background:var(--wacht);}
.section-label.afgerond-label::before{background:var(--ok);}
.section-label.geleverd-label::before{background:var(--ok);}
.next-pickup-banner{
  background:rgba(59,130,246,0.12);
  border:1px solid rgba(59,130,246,0.4);
  color:var(--wacht);
  font-size:13px;font-weight:600;
  padding:10px 12px;border-radius:var(--radius);
  margin-bottom:12px;
}
.reorder-row{display:flex;gap:6px;margin-top:8px;}
.reorder-btn{
  background:var(--panel-alt);border:1px solid var(--line);color:var(--text-dim);
  width:30px;height:26px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;
}
.reorder-btn:active{background:var(--line);}
.star-badge{color:var(--warn);font-size:14px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-title{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;text-transform:capitalize;}
.cal-nav{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--panel-alt);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;font-size:20px;color:var(--text-dim);}
.cal-nav:active{background:var(--line);}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text-dim);margin-bottom:6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);font-size:13px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:600;}
.cal-cell.cal-empty{cursor:default;background:none;}
.cal-cell.cal-disabled{cursor:default;background:none;color:var(--text-dim);opacity:0.35;}
.cal-cell.cal-free{background:rgba(47,158,122,0.16);color:var(--ok);}
.cal-cell.cal-active{background:rgba(210,86,79,0.28);color:#ff9a94;}
.cal-cell.cal-today{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;}
.cal-cell.cal-selected{box-shadow:inset 0 0 0 2px #fff;}
.cal-legend{display:flex;align-items:center;font-size:11.5px;color:var(--text-dim);margin-top:12px;}
.cal-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;}
.cal-dot.cal-free{background:var(--ok);}
.cal-dot.cal-active{background:#ff9a94;}
.card-delete-btn{
  color:var(--danger);font-size:15px;
  width:26px;height:26px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.brand-logo-img{max-height:30px;max-width:170px;display:block;object-fit:contain;}
.day-group{margin-bottom:22px;}
.day-group h2{
  font-size:16px;
  color:var(--accent);
  margin:0 0 8px 2px;
  text-transform:uppercase;
  font-size:13px;
  letter-spacing:0.6px;
}
.card{
  background:var(--panel);
  border-left:3px solid var(--line);
  border-radius:0 var(--radius) var(--radius) 0;
  padding:12px 14px;
  margin-bottom:10px;
  cursor:pointer;
  position:relative;
}
.card.status-te-leveren{border-left-color:var(--accent);}
.card.status-geplaatst{border-left-color:var(--wacht);}
.card.status-afgerond{border-left-color:var(--ok);opacity:0.72;}
.card.status-geleverd-klaar{border-left-color:var(--ok);}
.card.status-nog-niet-klaar{border-left-color:var(--line);opacity:0.7;}
.card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.card .klant{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;}
.card .tijd{font-size:13px;color:var(--text-dim);white-space:nowrap;}
.card .adres{font-size:13px;color:var(--text-dim);margin-top:2px;}
.badge{
  display:inline-block;
  font-size:11px;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600;
  padding:2px 8px;
  border-radius:10px;
  margin-top:6px;
  letter-spacing:0.3px;
}
.badge.te-leveren{background:rgba(232,99,30,0.18);color:var(--accent);}
.badge.geplaatst{background:rgba(59,130,246,0.18);color:var(--wacht);}
.badge.afgerond{background:rgba(47,158,122,0.18);color:var(--ok);}

.card.card-mine{border-left-color:var(--accent);background:linear-gradient(90deg, rgba(232,99,30,0.08), var(--panel) 40%);}
.assign-badge{
  font-size:12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  padding:4px 10px;border-radius:10px;letter-spacing:0.3px;
}
.assign-badge.mine{background:var(--accent);color:#fff;}
.assign-badge.other{background:rgba(47,158,122,0.24);color:var(--ok);}
.assign-badge.open{background:rgba(210,86,79,0.24);color:var(--danger);}
.empty{
  text-align:center;
  color:var(--text-dim);
  padding:60px 20px;
  font-size:14px;
}
.empty .big{font-family:'Barlow Condensed',sans-serif;font-size:20px;color:var(--text);margin-bottom:6px;}

/* Buttons */
button{font-family:'Inter',sans-serif;}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:var(--radius);
  padding:13px 16px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  width:100%;
}
.btn:active{background:var(--accent-dim);}
.btn.secondary{background:var(--panel-alt);color:var(--text);border:1px solid var(--line);}
.btn.ok{background:var(--ok);}
.btn.ghost{background:none;color:var(--accent);padding:10px 4px;width:auto;}
.btn.danger{background:none;border:1px solid var(--danger);color:var(--danger);}
.btn.danger:active{background:rgba(210,86,79,0.12);}
.btn.small{padding:9px 12px;font-size:13px;width:auto;}
.btn:disabled{opacity:0.45;cursor:default;}

/* Detail view */
.back{
  display:flex;align-items:center;gap:6px;
  color:var(--text-dim);
  font-size:14px;
  cursor:pointer;
  margin-bottom:12px;
}
.detail-head{margin-bottom:14px;}
.detail-head .klant{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;}
.detail-head .adres{color:var(--text-dim);font-size:14px;margin-top:2px;}
.detail-head .meta{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--text-dim);}

.section{
  background:var(--panel);
  border-radius:var(--radius);
  border:1px solid var(--line);
  padding:14px 16px;
  margin-bottom:14px;
}
.section h3{
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--text-dim);
  margin:0 0 12px 0;
}
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:5px;}
.field input[type=text],.field input[type=tel],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea{
  width:100%;
  background:var(--panel-alt);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:var(--radius);
  padding:10px 11px;
  font-size:14px;
  font-family:'Inter',sans-serif;
}
.field textarea{resize:vertical;min-height:64px;}

.check-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  gap:12px;
}
.check-row:last-child{border-bottom:none;}
.check-row .txt{font-size:14px;}
.check-row .sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.toggle{
  width:46px;height:27px;
  background:var(--panel-alt);
  border:1px solid var(--line);
  border-radius:14px;
  position:relative;
  cursor:pointer;
  flex-shrink:0;
}
.toggle .knob{
  position:absolute;top:2px;left:2px;
  width:21px;height:21px;
  border-radius:50%;
  background:var(--text-dim);
  transition:left .15s, background .15s;
}
.toggle.on{background:rgba(47,158,122,0.25);border-color:var(--ok);}
.toggle.on .knob{left:21px;background:var(--ok);}

.pillgroup{display:flex;gap:8px;flex-wrap:wrap;}
.pill{
  padding:8px 13px;
  border-radius:16px;
  border:1px solid var(--line);
  background:var(--panel-alt);
  color:var(--text-dim);
  font-size:13px;
  cursor:pointer;
}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.waze-btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  background:#33ccff;
  color:#0a2733;
  font-weight:700;
  border-radius:var(--radius);
  padding:14px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:17px;
  cursor:pointer;
  border:none;
  width:100%;
}

.photos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;background:var(--panel-alt);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .rm{
  position:absolute;top:3px;right:3px;
  background:rgba(0,0,0,0.6);color:#fff;
  border-radius:50%;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;cursor:pointer;
}
.add-photo{
  aspect-ratio:1;border-radius:var(--radius);
  border:1.5px dashed var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:26px;cursor:pointer;
}

.statusbar-select{margin-bottom:14px;}
.statusbar-select select{
  width:100%;background:var(--panel-alt);border:1px solid var(--line);color:var(--text);
  padding:10px;border-radius:var(--radius);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;
}

.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--ok);color:#fff;padding:10px 18px;border-radius:20px;
  font-size:13px;font-weight:600;z-index:50;
  opacity:0;pointer-events:none;transition:opacity .2s, bottom .2s;
}
.toast.show{opacity:1;bottom:100px;}

.stack{display:flex;flex-direction:column;gap:10px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.locked-block{opacity:0.5;pointer-events:none;user-select:none;}
.locked-banner{
  display:flex;align-items:center;gap:6px;
  background:rgba(47,158,122,0.12);
  border:1px solid rgba(47,158,122,0.4);
  color:var(--ok);
  font-size:12.5px;font-weight:600;
  padding:8px 11px;border-radius:var(--radius);
  margin-bottom:12px;
}
.queue-note{
  background:var(--panel-alt);
  border:1px dashed var(--line);
  color:var(--text-dim);
  font-size:12.5px;
  padding:10px 12px;
  border-radius:var(--radius);
  text-align:center;
}
.auth-wrap{
  max-width:360px;margin:0 auto;
  min-height:100vh;
  display:flex;flex-direction:column;justify-content:center;
  padding:24px;
}
.auth-wrap .field{margin-bottom:12px;}
.auth-wrap .error{
  color:var(--danger);font-size:13px;margin:-4px 0 12px;min-height:16px;
}
.auth-wrap .switch-link{
  text-align:center;color:var(--text-dim);font-size:13px;margin-top:14px;cursor:pointer;
}
.auth-wrap .switch-link b{color:var(--accent);font-weight:600;}
.user-chip{
  display:flex;align-items:center;gap:8px;
  font-size:12.5px;color:var(--text-dim);
}
.user-chip .logout{color:var(--accent);cursor:pointer;font-weight:600;}
.theme-toggle{cursor:pointer;font-size:15px;margin-right:2px;}
.link-toggle{
  display:inline-block;
  font-size:12.5px;
  color:var(--text-dim);
  cursor:pointer;
  padding:4px 0;
}
.link-toggle:active{color:var(--text);}
.occ-panel-box{
  margin-top:8px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--panel);
}
.mini-row{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.mini-row:last-child{border-bottom:none;}
.mini-row-title{font-size:14px;}
.mini-row-type{font-size:11px;color:var(--text-dim);margin-left:4px;}
.mini-row-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.driver-block{border-bottom:1px solid var(--line);padding:10px 0;}
.driver-block:last-child{border-bottom:none;}
.driver-block summary{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  list-style:none;
}
.driver-block summary::-webkit-details-marker{display:none;}
.driver-count{font-family:'Inter',sans-serif;font-weight:400;font-size:12px;color:var(--text-dim);}
.team-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line);
}
.team-row:last-child{border-bottom:none;}
.team-row .naam{font-size:14px;}
.team-row .rolbadge{font-size:11px;color:var(--text-dim);margin-top:2px;}
.team-row .rm{color:var(--danger);font-size:12px;cursor:pointer;}
.note-banner{
  background:rgba(217,164,65,0.12);
  border:1px solid rgba(217,164,65,0.4);
  border-radius:var(--radius);
  padding:10px 12px;
  font-size:12.5px;
  color:var(--warn);
  margin-bottom:14px;
  line-height:1.4;
}

/* Tablet en groter: gebruik meer van de beschikbare breedte */
@media (min-width: 700px){
  #app, .tabbar{ max-width:760px; }
  main{ padding:22px 28px; }
  .photos-grid{ grid-template-columns:repeat(4,1fr); }
  #locations-map{ height:360px !important; }
  .tabbar button{ font-size:16px; padding:14px 4px 12px; }
  .card{ padding:16px 18px; }
}
@media (min-width: 1000px){
  #app, .tabbar{ max-width:920px; }
  .photos-grid{ grid-template-columns:repeat(6,1fr); }
  #locations-map{ height:420px !important; }
}
</style>
</head>
<body>
<div id="authScreen" style="display:none">
  <div class="auth-wrap">
    <div class="brand-wrap" style="margin-bottom:4px">
      <img src="/logo.png" alt="Belair-Fun" class="brand-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='';">
      <div class="brand" style="font-size:28px;display:none">Belair<span class="dot">·</span>Fun</div>
    </div>
    <div id="authSub" class="sub" style="margin-bottom:22px">Planning &amp; overzicht</div>
    <div id="authForm"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div>
      <img src="/logo.png" alt="Belair-Fun" class="brand-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='';">
      <div class="brand" style="display:none">Belair<span class="dot">·</span>Fun</div>
      <div class="sub" id="topbarSub">Planning</div>
    </div>
    <div id="topbarAction"></div>
  </div>
  <main id="main"></main>
  <div class="tabbar">
    <button data-tab="list" class="tab-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      Planning
    </button>
    <button data-tab="new" class="tab-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Nieuw
    </button>
    <button data-tab="dossiers" class="tab-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 9h16"/></svg>
      Overzicht
    </button>
    <button data-tab="team" class="tab-btn" id="teamTabBtn" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Team
    </button>
    <button data-tab="instellingen" class="tab-btn" id="instellingenTabBtn" style="display:none">

<script>
// ---------- State ----------
let deliveries = [];
let view = 'list';
let currentId = null;
let checklistMode = 'plaatsing'; // 'plaatsing' | 'afhaling'
let busy = false;

const STATUS_LABEL = {
  'te-leveren': 'Te leveren',
  'geplaatst': 'Geplaatst — wacht op afhaling',
  'afgerond': 'Afgerond'
};

// ---------- Auth state ----------
let authToken = localStorage.getItem('bf-token') || null;
let currentUser = null;
let authMode = 'login'; // 'login' | 'setup'
const persistedIds = new Set();

async function apiFetch(path, opts){
  opts = opts || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if(authToken) headers['Authorization'] = 'Bearer ' + authToken;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if(res.status === 401 && path !== '/api/login' && path !== '/api/setup'){
    doLogout();
    throw new Error('Sessie verlopen, log opnieuw in');
  }
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((body && body.error) || 'Er ging iets mis');
  return body;
}

function doLogout(reload){
  stopLocationSharing();
  authToken = null; currentUser = null;
  localStorage.removeItem('bf-token');
  if(reload !== false) showAuthScreen();
}

// ---------- Data helpers (via API) ----------
async function loadDeliveries(){
  deliveries = await apiFetch('/api/deliveries');
  persistedIds.clear();
  deliveries.forEach(d => persistedIds.add(d.id));
}
async function saveDeliveries(d){
  if(!d) return;
  if(persistedIds.has(d.id)){
    await apiFetch('/api/deliveries/' + d.id, { method:'PUT', body: JSON.stringify(d) });
  }else{
    await apiFetch('/api/deliveries', { method:'POST', body: JSON.stringify(d) });
    persistedIds.add(d.id);
  }
}
function getDelivery(id){ return deliveries.find(d => d.id === id); }

async function loadPhotos(id){
  try{ return await apiFetch('/api/deliveries/' + id + '/photos'); }
  catch(e){ return []; }
}
async function addPhotoRemote(id, naam, dataUrl){
  return apiFetch('/api/deliveries/' + id + '/photos', { method:'POST', body: JSON.stringify({ naam, dataUrl }) });
}
async function removePhotoRemote(deliveryId, photoId){
  await apiFetch('/api/deliveries/' + deliveryId + '/photos/' + photoId, { method:'DELETE' });
}

// ---------- Utilities ----------
function uid(){ return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('nl-BE', { weekday:'short', day:'numeric', month:'short' });
}
function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function normalizeOndergrond(v){
  if(!v) return '';
  const s = String(v).toLowerCase();
  if(s.includes('hard')) return 'Harde ondergrond';
  if(s.includes('gras') || s.includes('grass')) return 'Op gras';
  return v;
}
function emptyDelivery(){
  return {
    id: uid(),
    klant: '', telefoon: '', email: '', adres: '', postcode: '', ondergrond: '',
    datum: todayISO(), tijdslot: '',
    afhaaldatum: '', afhaaltijd: '',
    artikelen: '', bedrag: '', boekingsnummer: '',
    status: 'te-leveren',
    toegewezenAan: null, // { id, naam } chauffeur voor levering, of null = voor alle chauffeurs
    toegewezenAanAfhaling: null, // { id, naam } chauffeur voor afhaling, apart van levering
    handmatigeVolgorde: null, // getal = manueel bepaalde positie in de planning
    plaatsing: {
      correctGeplaatst: false,
      bevestiging: '', // pinnen | zandzakken | verankering | geen
      valmatten: false,
      verlengkabel: false,
      aantalKabels: '',
      aantalZandzakken: '',
      netjes: false,
      opmerkingen: '',
      tijdstip: '',
      bevestigd: false,
      bevestigdOp: ''
    },
    betaling: { status: '', opmerking: '' }, // voldaan-cash | voldaan-overschrijving | factuur
    afhaling: {
      valmattenTerug: false,
      kabelsTerug: false,
      bevestigingTerug: false, // pinnen/zandzakken/verankering terug mee, afhankelijk van plaatsing.bevestiging
      natOfVuil: false,
      reinigingNodig: false,
      opmerkingen: '',
      tijdstip: '',
      bevestigd: false,
      bevestigdOp: '',
      verzetAangevraagd: false, // afhaling lukte niet, verzetting naar andere dag aangevraagd
      verzetNaarDatum: '', // voorgestelde nieuwe afhaaldatum
      verzetReden: ''
    }
  };
}
function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('nl-BE', { day:'numeric', month:'short' }) + ' om ' + d.toLocaleTimeString('nl-BE', { hour:'2-digit', minute:'2-digit', hour12:false });
}

// ---------- Routing / render ----------
function setView(v, id){
  view = v;
  currentId = id || null;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === v || (v==='detail' && b.dataset.tab==='list'));
  });
  render();
}

function render(){
  const main = document.getElementById('main');
  const sub = document.getElementById('topbarSub');
  const action = document.getElementById('topbarAction');
  const themeIcon = currentTheme === 'light' ? '🌙' : '☀️';
  action.innerHTML = `<div class="user-chip"><span class="theme-toggle" id="theme-toggle-btn" title="Wissel donker/licht">${themeIcon}</span>${escapeHtml(currentUser ? currentUser.naam : '')}<span class="logout" id="logout-btn">Uitloggen</span></div>`;
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=> doLogout());
  const themeToggleBtn = document.getElementById('theme-toggle-btn');
  if(themeToggleBtn) themeToggleBtn.addEventListener('click', toggleTheme);

  try{
    if(view === 'list'){
      sub.textContent = 'Planning';
      main.innerHTML = renderList();
      bindListEvents();
    } else if(view === 'new'){
      sub.textContent = 'Nieuwe levering';
      main.innerHTML = renderNewForm();
      bindNewFormEvents();
    } else if(view === 'dossiers'){
      sub.textContent = 'Overzicht';
      main.innerHTML = renderDossiers();
      bindDossierEvents();
    } else if(view === 'team'){
      sub.textContent = 'Team';
      main.innerHTML = renderTeam();
      Promise.resolve(bindTeamEvents()).catch(err=>{
        console.error('Fout bij laden van Team-gegevens:', err);
        showToast('Fout bij laden Team: ' + err.message);
      });
    } else if(view === 'instellingen'){
      sub.textContent = 'Instellingen';
      main.innerHTML = renderInstellingen();
      Promise.resolve(bindInstellingenEvents()).catch(err=>{
        console.error('Fout bij laden van Instellingen:', err);
        showToast('Fout bij laden Instellingen: ' + err.message);
      });
    } else if(view === 'detail'){
      const d = getDelivery(currentId);
      if(!d){ setView('list'); return; }
      sub.textContent = d.klant || 'Levering';
      main.innerHTML = renderDetail(d);
      bindDetailEvents(d);
    }
  }catch(err){
    console.error('Render-fout bij view "' + view + '":', err);
    main.innerHTML = `<div class="section" style="border-color:var(--danger)">
      <h3 style="color:var(--danger)">Er ging iets mis bij het tonen van dit scherm</h3>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px">Maak hier een screenshot van en stuur die door:</div>
      <div style="font-family:monospace;font-size:11.5px;white-space:pre-wrap;background:var(--panel-alt);padding:10px;border-radius:var(--radius);color:var(--danger)">${escapeHtml(view + ': ' + (err && err.stack ? err.stack : String(err)))}</div>
    </div>`;
  }
}

function miniRow(d, typeLabel){
  const tijd = typeLabel === 'Levering' ? d.tijdslot : d.afhaaltijd;
  const datum = typeLabel === 'Levering' ? d.datum : (d.afhaaldatum || d.datum);
  return `<div class="mini-row" data-id="${d.id}">
    <div class="mini-row-title">${escapeHtml(d.klant || 'Naamloos')} <span class="mini-row-type">${typeLabel}</span></div>
    <div class="mini-row-sub">${fmtDate(datum)}${tijd ? ' · ' + escapeHtml(tijd) : ''} — ${escapeHtml(d.adres || '')}</div>
    <span class="badge ${d.status}" style="margin-top:6px">${STATUS_LABEL[d.status]}</span>
  </div>`;
}
let perDriverDate = todayISO();
const BETALING_LABELS = { 'reeds-voldaan':'Reeds voldaan', 'voldaan-cash':'Voldaan (cash)', 'voldaan-overschrijving':'Voldaan (overschrijving)', 'factuur':'Factuur opmaken' };
function isOnbetaald(d){
  return !['reeds-voldaan','voldaan-cash','voldaan-overschrijving'].includes(d.betaling.status);
}
function renderOnbetaald(){
  const items = deliveries.filter(d => (d.datum === perDriverDate || d.afhaaldatum === perDriverDate) && isOnbetaald(d))
    .sort((a,b)=> (a.klant||'').localeCompare(b.klant||''));
  if(items.length === 0) return `<div class="queue-note" style="text-align:left">✓ Alles in orde voor deze dag.</div>`;
  return items.map(d => `<div class="mini-row" data-id="${d.id}">
    <div class="mini-row-title">${escapeHtml(d.klant || 'Naamloos')} <span class="mini-row-type">${d.betaling.status ? escapeHtml(BETALING_LABELS[d.betaling.status]||d.betaling.status) : 'Niet ingevuld'}</span></div>
    <div class="mini-row-sub">${escapeHtml(primaryProductLabel(d))}${d.bedrag ? ' — € ' + escapeHtml(d.bedrag) : ''}</div>
  </div>`).join('');
}
function renderVuilTerug(){
  const items = deliveries.filter(d => d.afhaling.natOfVuil && (d.afhaaldatum === perDriverDate || (!d.afhaaldatum && d.datum === perDriverDate)))
    .sort((a,b)=> (a.klant||'').localeCompare(b.klant||''));
  if(items.length === 0) return `<div class="queue-note" style="text-align:left">✓ Niets vuil teruggekomen voor deze dag.</div>`;
  return items.map(d => `<div class="mini-row" data-id="${d.id}">
    <div class="mini-row-title">${escapeHtml(d.klant || 'Naamloos')} <span class="mini-row-type">${d.afhaling.reinigingNodig ? 'Reiniging nodig' : 'Vuil'}</span></div>
    <div class="mini-row-sub">${escapeHtml(primaryProductLabel(d))}${d.afhaling.opmerkingen ? ' — ' + escapeHtml(d.afhaling.opmerkingen) : ''}</div>
  </div>`).join('');
}
async function generateDagrapportPdf(dateStr){
  const onbetaald = deliveries.filter(d => (d.datum === dateStr || d.afhaaldatum === dateStr) && isOnbetaald(d))
    .sort((a,b)=> (a.klant||'').localeCompare(b.klant||''));
  const vuilTerug = deliveries.filter(d => d.afhaling.natOfVuil && (d.afhaaldatum === dateStr || (!d.afhaaldatum && d.datum === dateStr)))
    .sort((a,b)=> (a.klant||'').localeCompare(b.klant||''));

  if(!window.jspdf){ showToast('PDF-bibliotheek nog aan het laden, probeer opnieuw'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const marginL = 16;
  let y = 18;
  const pageH = doc.internal.pageSize.getHeight();
  const pageW = doc.internal.pageSize.getWidth();
  function ensureSpace(h){ if(y + h > pageH - 16){ doc.addPage(); y = 18; } }
  function heading(text, kleur){
    ensureSpace(10);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(kleur[0],kleur[1],kleur[2]);
    doc.text(text, marginL, y); y += 6;
    doc.setDrawColor(kleur[0],kleur[1],kleur[2]); doc.setLineWidth(0.4);
    doc.line(marginL, y-4.5, pageW-marginL, y-4.5); y += 2;
    doc.setTextColor(30,30,30);
  }
  function regel(hoofd, sub){
    ensureSpace(11);
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(30,30,30);
    doc.text(hoofd, marginL, y); y += 5;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(110,110,110);
    const wrapped = doc.splitTextToSize(sub, pageW - marginL*2);
    doc.text(wrapped, marginL, y); y += wrapped.length*4.6 + 3;
    doc.setTextColor(30,30,30);
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(30,30,30);
  doc.text('Belair-Fun', marginL, y); y += 7;
  doc.setFontSize(13); doc.setTextColor(90,90,90);
  doc.text('Dagrapport — ' + fmtDate(dateStr), marginL, y); y += 4;
  doc.setDrawColor(210,210,210); doc.line(marginL, y, pageW-marginL, y); y += 10;
  doc.setTextColor(30,30,30);

  heading(`Nog te betalen (${onbetaald.length})`, [217,164,65]);
  if(onbetaald.length === 0){
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(110,110,110);
    doc.text('Alles in orde voor deze dag.', marginL, y); y += 8; doc.setTextColor(30,30,30);
  } else {
    onbetaald.forEach(d => regel(
      `${d.klant || 'Naamloos'} — ${BETALING_LABELS[d.betaling.status] || 'Niet ingevuld'}${d.bedrag ? ' — € ' + d.bedrag : ''}`,
      primaryProductLabel(d)
    ));
  }
  y += 4;

  heading(`Vuil teruggebracht — aandacht nodig (${vuilTerug.length})`, [210,86,79]);
  if(vuilTerug.length === 0){
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(110,110,110);
    doc.text('Niets vuil teruggekomen voor deze dag.', marginL, y); y += 8; doc.setTextColor(30,30,30);
  } else {
    vuilTerug.forEach(d => regel(
      `${d.klant || 'Naamloos'} — ${d.afhaling.reinigingNodig ? 'Reiniging nodig' : 'Vuil'}`,
      primaryProductLabel(d) + (d.afhaling.opmerkingen ? ' — ' + d.afhaling.opmerkingen : '')
    ));
  }

  ensureSpace(16);
  y += 4;
  doc.setDrawColor(210,210,210); doc.line(marginL, y, pageW-marginL, y); y += 6;
  doc.setFontSize(9); doc.setTextColor(140,140,140);
  doc.text('Gegenereerd op ' + new Date().toLocaleString('nl-BE', { hour12:false }), marginL, y);

  const fileName = 'dagrapport-' + dateStr + '.pdf';
  try{
    const blob = doc.output('blob');
    const file = new File([blob], fileName, { type: 'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Dagrapport ' + fmtDate(dateStr), text: fileName });
      return;
    }
  }catch(err){ /* val terug op downloaden */ }
  doc.save(fileName);
}
function renderUnassigned(){
  const openLeveringen = deliveries.filter(d => d.status === 'te-leveren' && !d.toegewezenAan && d.datum === perDriverDate)
    .sort((a,b)=> sortKeyFor(a,'tijdslot') - sortKeyFor(b,'tijdslot'));
  const openAfhalingen = deliveries.filter(d => d.status !== 'afgerond' && !d.toegewezenAanAfhaling && (d.afhaaldatum || d.datum) === perDriverDate)
    .sort((a,b)=> sortKeyFor(a,'afhaaltijd') - sortKeyFor(b,'afhaaltijd'));
  if(openLeveringen.length === 0 && openAfhalingen.length === 0){
    return `<div class="queue-note" style="text-align:left">✓ Niets onbeheerd op deze dag.</div>`;
  }
  let html = '';
  if(openLeveringen.length){
    html += `<div class="section-label te-leveren-label" style="margin-top:0">Leveringen zonder chauffeur (${openLeveringen.length})</div>`;
    html += openLeveringen.map(d => miniRow(d, 'Levering')).join('');
  }
  if(openAfhalingen.length){
    html += `<div class="section-label op-te-halen-label">Afhalingen zonder chauffeur (${openAfhalingen.length})</div>`;
    html += openAfhalingen.map(d => miniRow(d, 'Afhaling')).join('');
  }
  return html;
}
function renderPerVehicle(){
  if(teamsData.length === 0) return `<div class="queue-note" style="text-align:left">Nog geen voertuigen aangemaakt.</div>`;
  const blocks = teamsData.map(t=>{
    const leveringen = deliveries.filter(d => d.toegewezenAan && d.toegewezenAan.type==='team' && d.toegewezenAan.id===t.id && d.datum === perDriverDate)
      .sort((a,b)=> sortKeyFor(a,'tijdslot') - sortKeyFor(b,'tijdslot'));
    const afhalingen = deliveries.filter(d => d.toegewezenAanAfhaling && d.toegewezenAanAfhaling.type==='team' && d.toegewezenAanAfhaling.id===t.id && (d.afhaaldatum || d.datum) === perDriverDate)
      .sort((a,b)=> sortKeyFor(a,'afhaaltijd') - sortKeyFor(b,'afhaaltijd'));
    const totaal = leveringen.length + afhalingen.length;
    if(totaal === 0) return '';
    const afgerond = leveringen.filter(d=>d.status==='afgerond').length + afhalingen.filter(d=>d.status==='afgerond').length;
    const bemanning = t.leden.map(l=>escapeHtml(l.naam)).join(', ') || 'Geen bemanning';
    return `<details class="driver-block" open>
      <summary>${escapeHtml(t.naam)} <span class="driver-count">${afgerond}/${totaal} afgerond</span></summary>
      <div style="font-size:11.5px;color:var(--text-dim);margin:-4px 0 8px">Bemanning: ${bemanning}</div>
      ${leveringen.length ? `<div class="section-label te-leveren-label">Leveringen</div>${leveringen.map(d=>miniRow(d,'Levering')).join('')}` : ''}
      ${afhalingen.length ? `<div class="section-label op-te-halen-label">Afhalingen</div>${afhalingen.map(d=>miniRow(d,'Afhaling')).join('')}` : ''}
      ${leveringen.length ? `<button class="btn small secondary" style="margin-top:10px" data-laadlijst="${t.id}">📄 Laadlijst PDF (${leveringen.length} leveringen)</button>` : ''}
    </details>`;
  }).filter(Boolean);
  if(blocks.length === 0){
    return `<div class="queue-note" style="text-align:left">Geen enkel voertuig heeft die dag iets gepland.</div>`;
  }
  return blocks.join('');
}
function materiaalLabelVoorItem(naam, ondergrondNorm){
  const p = findProduct(naam);
  if(!p) return null;
  const parts = [];
  if(p.motorType) parts.push(`${p.aantalMotors||1}x ${motorTypeLabel(p.motorType)}`);
  const kabels = (p.verlengkabelStandaard||0) + (p.verlengkabelDubbel||0);
  if(p.verlengkabelStandaard) parts.push(`${p.verlengkabelStandaard} kabel${p.verlengkabelStandaard>1?'s':''} standaard`);
  if(p.verlengkabelDubbel) parts.push(`${p.verlengkabelDubbel} kabel${p.verlengkabelDubbel>1?'s':''} dubbel`);
  if(ondergrondNorm === 'Op gras'){
    if(p.pinnen) parts.push(`${p.pinnen} pinnen`);
  } else if(ondergrondNorm === 'Harde ondergrond'){
    if(p.zandzakken) parts.push(`${p.zandzakken} zandzakken`);
    if(p.valmatten) parts.push(`${p.valmatten} valmatten`);
  } else {
    // ondergrond onbekend: toon beide mogelijkheden
    if(p.pinnen) parts.push(`${p.pinnen} pinnen (gras)`);
    if(p.zandzakken || p.valmatten) parts.push(`${p.zandzakken||0} zandzakken + ${p.valmatten||0} valmatten (hard)`);
  }
  if(p.overige) parts.push(p.overige);
  return parts.length ? parts.join(', ') : null;
}
async function generateLaadlijstPdf(teamId, dateStr){
  const team = teamsData.find(t => t.id === teamId);
  const leveringen = deliveries.filter(d => d.toegewezenAan && d.toegewezenAan.type==='team' && d.toegewezenAan.id===teamId && d.datum === dateStr)
    .sort((a,b)=> sortKeyFor(a,'tijdslot') - sortKeyFor(b,'tijdslot'))
    .reverse(); // laatste levering van de dag = eerst inladen

  if(!window.jspdf){ showToast('PDF-bibliotheek nog aan het laden, probeer opnieuw'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const marginL = 16;
  let y = 18;
  const pageH = doc.internal.pageSize.getHeight();
  const pageW = doc.internal.pageSize.getWidth();
  function ensureSpace(h){ if(y + h > pageH - 16){ doc.addPage(); y = 18; } }
  function drawCheckbox(x, yBaseline, size){
    size = size || 3.8;
    doc.setDrawColor(120,120,120); doc.setLineWidth(0.35);
    doc.rect(x, yBaseline - size + 0.9, size, size);
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(30,30,30);
  doc.text('Belair-Fun', marginL, y); y += 7;
  doc.setFontSize(13); doc.setTextColor(90,90,90);
  doc.text('Laadlijst — ' + (team ? team.naam : 'Voertuig') + ' — ' + fmtDate(dateStr), marginL, y); y += 4;
  doc.setDrawColor(210,210,210); doc.line(marginL, y, pageW-marginL, y); y += 6;
  doc.setFontSize(9.5); doc.setTextColor(120,120,120);
  doc.text('Laad van boven naar onder: nummer 1 eerst inladen (= laatste levering van de dag).', marginL, y); y += 8;
  doc.setTextColor(30,30,30);

  // Totalen die we onderaan gaan tonen
  const motorTotalen = {}; // type -> aantal
  let kabelStandaardTotaal = 0, kabelDubbelTotaal = 0;
  let pinnenTotaal = 0, zandzakkenTotaal = 0, valmattenTotaal = 0;
  const overigeTotalen = {}; // omschrijving -> aantal

  leveringen.forEach((d, i) => {
    const ondergrondNorm = normalizeOndergrond(d.ondergrond);
    ensureSpace(24);

    doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(232,99,30);
    const titelWrapped = doc.splitTextToSize(`${i+1}. ${primaryProductLabel(d)}`, pageW - marginL*2 - 8);
    ensureSpace(titelWrapped.length*6);
    drawCheckbox(pageW - marginL - 5.5, y, 5.5);
    doc.text(titelWrapped, marginL, y); y += titelWrapped.length*6;
    doc.setDrawColor(232,99,30); doc.setLineWidth(0.3); doc.line(marginL, y-3.5, pageW-marginL, y-3.5); y += 1.5;
    doc.setTextColor(30,30,30);

    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const adresWrapped = doc.splitTextToSize(d.adres || 'Geen adres', pageW - marginL*2);
    ensureSpace(adresWrapped.length*5);
    doc.text(adresWrapped, marginL, y); y += adresWrapped.length*5;

    doc.setFontSize(9); doc.setTextColor(130,130,130);
    doc.text(`${d.tijdslot || '?'} — ${d.klant || ''}`, marginL, y); y += 5;
    doc.setTextColor(90,90,90);
    doc.text('Ondergrond: ' + (ondergrondNorm || 'onbekend'), marginL, y); y += 6;
    doc.setTextColor(30,30,30);

    const agg = aggregateArtikelen(d.artikelen);
    agg.forEach(item => {
      const materiaalLabel = materiaalLabelVoorItem(item.naam, ondergrondNorm);
      const label = (item.aantal > 1 ? `${item.aantal}x ` : '') + item.naam + (materiaalLabel ? '  —  ' + materiaalLabel : '');
      const wrapped = doc.splitTextToSize(label, pageW - marginL*2 - 10);
      ensureSpace(wrapped.length*5.2);
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      drawCheckbox(marginL + 2, y, 3.6);
      doc.text(wrapped, marginL + 8, y);
      y += wrapped.length*5.2;

      // Tel mee voor het totaaloverzicht (per stuk van dit item, x aantal keer besteld)
      const p = findProduct(item.naam);
      if(p){
        const factor = item.aantal;
        if(p.motorType) { const mLabel = motorTypeLabel(p.motorType); motorTotalen[mLabel] = (motorTotalen[mLabel]||0) + (p.aantalMotors||1)*factor; }
        kabelStandaardTotaal += (p.verlengkabelStandaard||0)*factor;
        kabelDubbelTotaal += (p.verlengkabelDubbel||0)*factor;
        if(ondergrondNorm === 'Harde ondergrond'){
          zandzakkenTotaal += (p.zandzakken||0)*factor;
          valmattenTotaal += (p.valmatten||0)*factor;
        } else {
          pinnenTotaal += (p.pinnen||0)*factor;
        }
        if(p.overige){
          overigeTotalen[p.overige] = (overigeTotalen[p.overige]||0) + factor;
        }
      }
    });
    y += 4;
  });

  // Totaaloverzicht
  ensureSpace(30);
  doc.setDrawColor(210,210,210); doc.line(marginL, y, pageW-marginL, y); y += 8;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(232,99,30);
  doc.text('Totaal benodigd voor dit voertuig', marginL, y); y += 7;
  doc.setTextColor(30,30,30); doc.setFont('helvetica','normal'); doc.setFontSize(10.5);

  function totaalLijn(label, aantal){
    if(!aantal) return;
    ensureSpace(7);
    drawCheckbox(marginL, y, 3.8);
    doc.text(`${label}: ${aantal}`, marginL + 7, y); y += 7;
  }
  Object.keys(motorTotalen).forEach(type => totaalLijn(type, motorTotalen[type]));
  totaalLijn('Verlengkabels standaard', kabelStandaardTotaal);
  totaalLijn('Verlengkabels dubbel', kabelDubbelTotaal);
  totaalLijn('Pinnen (op gras)', pinnenTotaal);
  totaalLijn('Zandzakken (harde ondergrond)', zandzakkenTotaal);
  totaalLijn('Valmatten (harde ondergrond)', valmattenTotaal);
  Object.keys(overigeTotalen).forEach(naam => totaalLijn(naam, overigeTotalen[naam]));

  ensureSpace(16);
  y += 4;
  doc.setDrawColor(210,210,210); doc.line(marginL, y, pageW-marginL, y); y += 6;
  doc.setFontSize(9); doc.setTextColor(140,140,140);
  doc.text('Gegenereerd op ' + new Date().toLocaleString('nl-BE', { hour12:false }), marginL, y);

  const fileName = 'laadlijst-' + (team ? team.naam : 'voertuig').replace(/[^a-z0-9]+/gi,'-').toLowerCase() + '-' + dateStr + '.pdf';
  try{
    const blob = doc.output('blob');
    const file = new File([blob], fileName, { type: 'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Laadlijst ' + (team?team.naam:''), text: fileName });
      return;
    }
  }catch(err){ /* val terug op downloaden */ }
  doc.save(fileName);
}
function bindAssignmentOverviewEvents(){
  document.querySelectorAll('#unassigned-list .mini-row, #per-driver-list .mini-row, #onbetaald-list .mini-row, #vuil-list .mini-row').forEach(row=>{
    row.addEventListener('click', ()=> setView('detail', row.dataset.id));
  });
  const perDriverDateInput = document.getElementById('per-driver-date');
  if(perDriverDateInput){
    perDriverDateInput.addEventListener('change', (e)=>{
      perDriverDate = e.target.value || todayISO();
      document.getElementById('per-driver-list').innerHTML = renderPerVehicle();
      const unassignedEl = document.getElementById('unassigned-list');
      if(unassignedEl) unassignedEl.innerHTML = renderUnassigned();
      const onbetaaldEl = document.getElementById('onbetaald-list');
      if(onbetaaldEl) onbetaaldEl.innerHTML = renderOnbetaald();
      const vuilEl = document.getElementById('vuil-list');
      if(vuilEl) vuilEl.innerHTML = renderVuilTerug();
      bindAssignmentOverviewEvents();
    });
  }
  document.querySelectorAll('[data-laadlijst]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.preventDefault();
      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Bezig...';
      try{ await generateLaadlijstPdf(parseInt(btn.dataset.laadlijst,10), perDriverDate); }
      catch(err){ showToast(err.message); }
      btn.disabled = false;
      btn.textContent = orig;
    });
  });
}
async function bindTeamEvents(){
  document.getElementById('back-to-planning').addEventListener('click', ()=> setView('list'));
  document.getElementById('notify-send-btn').addEventListener('click', async ()=>{
    const target = document.getElementById('notify-target').value;
    const title = document.getElementById('notify-title').value.trim();
    const message = document.getElementById('notify-message').value.trim();
    const resultEl = document.getElementById('notify-result');
    if(!target){ showToast('Kies eerst een team of teamlid'); return; }
    if(!title || !message){ showToast('Vul titel en bericht in'); return; }
    const [type, id] = target.split(':');
    const body = type === 'team' ? { teamId: id, title, message } : { userId: id, title, message };
    resultEl.textContent = 'Bezig met versturen...';
    try{
      const r = await apiFetch('/api/notify', { method:'POST', body: JSON.stringify(body) });
      resultEl.textContent = `Verstuurd naar ${r.sent} toeste(l)len van de ${r.ontvangers} gekozen perso(o)n(en).` + (r.failed ? ` (${r.failed} niet bereikbaar — toestel had de app niet recent open staan)` : '');
      showToast('Melding verstuurd');
    }catch(err){
      resultEl.textContent = err.message;
      showToast(err.message);
    }
  });
  document.getElementById('dagrapport-pdf-btn').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    btn.disabled = true;
    const orig = btn.textContent;
    btn.textContent = 'Bezig...';
    try{ await generateDagrapportPdf(perDriverDate); }
    catch(err){ showToast(err.message); }
    btn.disabled = false;
    btn.textContent = orig;
  });
  await loadTeamsData();
  document.getElementById('unassigned-list').innerHTML = renderUnassigned();
  document.getElementById('onbetaald-list').innerHTML = renderOnbetaald();
  document.getElementById('vuil-list').innerHTML = renderVuilTerug();
  document.getElementById('per-driver-list').innerHTML = renderPerVehicle();
  bindAssignmentOverviewEvents();
  await loadDriverLocations();
}
async function bindInstellingenEvents(){
  document.getElementById('back-to-planning-instellingen').addEventListener('click', ()=> setView('list'));
  document.getElementById('save-settings-btn').addEventListener('click', async ()=>{
    const url = document.getElementById('s-google-review').value.trim();
    try{
      await apiFetch('/api/settings', { method:'PUT', body: JSON.stringify({ googleReviewUrl: url }) });
      appSettings.googleReviewUrl = url;
      showToast('Instellingen opgeslagen');
    }catch(err){ showToast(err.message); }
  });
  document.getElementById('qr-upload-btn').addEventListener('click', ()=> document.getElementById('qr-upload-file').click());
  document.getElementById('qr-upload-file').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await resizeImageFile(file, 500, 0.85);
      await apiFetch('/api/settings', { method:'PUT', body: JSON.stringify({ payconiqQrImage: dataUrl }) });
      appSettings.payconiqQrImage = dataUrl;
      showToast('QR-afbeelding opgeslagen');
      setView('instellingen');
    }catch(err){ showToast(err.message); }
    e.target.value = '';
  });
  document.getElementById('qr-remove-btn').addEventListener('click', async ()=>{
    if(!confirm('QR-afbeelding verwijderen?')) return;
    try{
      await apiFetch('/api/settings', { method:'PUT', body: JSON.stringify({ payconiqQrImage: '' }) });
      appSettings.payconiqQrImage = '';
      showToast('Verwijderd');
      setView('instellingen');
    }catch(err){ showToast(err.message); }
  });
  document.getElementById('sync-website-btn').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    const fullSync = document.getElementById('sync-full-sync').checked;
    if(fullSync && !confirm('Zeker? Dit vervangt alle eerder via de app doorgestuurde blokkeringen op je website door de huidige lijst.')) return;
    const resultEl = document.getElementById('sync-result');
    btn.disabled = true;
    resultEl.textContent = 'Bezig met synchroniseren...';
    try{
      const r = await apiFetch('/api/sync-website', { method:'POST', body: JSON.stringify({ fullSync }) });
      let msg = `${r.inserted} blokkering(en) bijgewerkt op de website (${r.verstuurd} boekingen verstuurd, ${r.mapped} producten herkend, ${r.ignored} genegeerd).`;
      if(r.failed) msg += ` ${r.failed} mislukt.`;
      if(r.unknown && r.unknown.length){
        msg += ' Onbekende productnamen: ' + r.unknown.map(u=>`${u.name} (${u.count}x)`).join(', ') + '.';
      }
      resultEl.textContent = msg;
      showToast('Synchronisatie voltooid');
    }catch(err){ resultEl.textContent = err.message; showToast(err.message); }
    btn.disabled = false;
  });
  document.getElementById('add-user-btn').addEventListener('click', async ()=>{
    const naam = document.getElementById('t-naam').value.trim();
    const username = document.getElementById('t-username').value.trim();
    const password = document.getElementById('t-password').value;
    const rol = document.getElementById('t-rol').value;
    if(!naam || !username || !password){ showToast('Vul alle velden in'); return; }
    try{
      await apiFetch('/api/users', { method:'POST', body: JSON.stringify({ naam, username, password, rol }) });
      showToast('Teamlid toegevoegd');
      setView('instellingen');
    }catch(err){ showToast(err.message); }
  });
  document.getElementById('team-add-btn').addEventListener('click', async ()=>{
    const naam = document.getElementById('team-naam').value.trim();
    if(!naam){ showToast('Geef het voertuig een naam'); return; }
    const memberIds = Array.from(document.querySelectorAll('.team-member-cb:checked')).map(cb => parseInt(cb.value,10));
    try{
      await apiFetch('/api/teams', { method:'POST', body: JSON.stringify({ naam, memberIds }) });
      showToast('Voertuig toegevoegd');
      document.getElementById('team-naam').value = '';

        reader.readAsDataURL(file);
      });

      let msg = r.imported + ' product(en) geïmporteerd/bijgewerkt.';

      resultEl.textContent = msg;

      await loadProductenData();

  });

function productSummaryLine(p){
  const parts = [];
  if(p.motorType) parts.push((p.aantalMotors||1) + 'x ' + motorTypeLabel(p.motorType));
  if(p.verlengkabelStandaard) parts.push(p.verlengkabelStandaard + ' kabel(s) standaard');
  if(p.verlengkabelDubbel) parts.push(p.verlengkabelDubbel + ' kabel(s) dubbel');
  if(p.pinnen) parts.push(p.pinnen + ' pinnen (gras)');
  if(p.zandzakken) parts.push(p.zandzakken + ' zandzakken (hard)');
  if(p.valmatten) parts.push(p.valmatten + ' valmatten (hard)');
  if(p.overige) parts.push(p.overige);
  if(p.opmerking) parts.push(p.opmerking);
  return parts.join(' · ') || 'Geen info';
}

let locationsMap = null;
let locationMarkers = [];
function timeAgo(iso){
  const diffMin = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if(diffMin < 1) return 'net nu';
  if(diffMin < 60) return diffMin + ' min geleden';
  const h = Math.round(diffMin/60);
  return h + ' u geleden';
}
async function loadDriverLocations(){
  const listEl = document.getElementById('locations-list');
  const mapEl = document.getElementById('locations-map');
  if(!listEl || !mapEl) return;
  let locs;
  try{ locs = await apiFetch('/api/locations'); }
  catch(err){ listEl.textContent = err.message; return; }

  try{
    if(typeof L === 'undefined'){
      mapEl.textContent = 'Kaart kon niet geladen worden (probeer de pagina te herladen).';
    } else {
      if(locationsMap){
        locationsMap.remove();
        locationsMap = null;
      }
      locationsMap = L.map('locations-map', { attributionControl: false }).setView([50.98, 4.05], 8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(locationsMap);
      locationMarkers = [];
    }
  }catch(err){
    console.error('Kaart laden mislukt:', err);
    mapEl.textContent = 'Kaart kon niet geladen worden.';
  }

  if(locs.length === 0){
    listEl.textContent = 'Nog geen chauffeur heeft de app recent open gehad.';
  } else {
    listEl.innerHTML = locs.map(l => `<div>📍 ${escapeHtml(l.naam)} — ${timeAgo(l.updated_at)}</div>`).join('');
    if(locationsMap){
      try{
        const bounds = [];
        locs.forEach(l=>{
          const marker = L.marker([l.lat, l.lng]).addTo(locationsMap)
            .bindPopup(escapeHtml(l.naam) + '<br>' + timeAgo(l.updated_at));
          locationMarkers.push(marker);
          bounds.push([l.lat, l.lng]);
        });
        if(bounds.length) locationsMap.fitBounds(bounds, { padding: [30,30], maxZoom: 14 });
      }catch(err){ console.error('Pinnen plaatsen mislukt:', err); }
    }
  }
  setTimeout(()=> locationsMap && locationsMap.invalidateSize(), 100);
}

function timeMinutes(str){
  if(!str) return null;
  const m = String(str).match(/(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function sortKeyFor(d, timeField){
  if(d.handmatigeVolgorde != null) return d.handmatigeVolgorde;
  const mins = timeMinutes(d[timeField]);
  return 100000 + (mins != null ? mins : 9999);
}

function isAssignedToMe(assignment){
  if(!assignment) return false;
  if(assignment.type === 'team') return myTeamIds.includes(assignment.id);
  return assignment.id === currentUser.id;
}
function assignmentMatchesUser(assignment, userId){
  if(!assignment) return false;
  if(assignment.type === 'team'){
    const team = teamsData.find(t => t.id === assignment.id);
    return team ? team.leden.some(l => l.id === userId) : false;
  }
  return assignment.id === userId;
}
function splitArtikelen(artikelen){
  return String(artikelen||'').split(/[\n,/+]/).map(s=>s.trim()).filter(Boolean);
}
function aggregateArtikelen(artikelen){
  const items = splitArtikelen(artikelen);
  const counts = new Map();
  items.forEach(i => counts.set(i, (counts.get(i)||0)+1));
  return Array.from(counts.entries()).map(([naam,aantal])=>({naam,aantal}));
}
function primaryProductLabel(d){
  const agg = aggregateArtikelen(d.artikelen);
  if(agg.length === 0) return d.klant || 'Naamloos';
  const shown = agg.slice(0,3).map(a => a.aantal>1 ? `${a.naam} x${a.aantal}` : a.naam).join(', ');
  return agg.length > 3 ? `${shown} (+${agg.length - 3} meer)` : shown;
}

function renderList(){
  const vehicleOccupancyPanel = renderVehicleOccupancyPanel();
  const filterBar = `
    <div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:10px">
      <span class="pill mij-toggle ${listFilter==='mij'?'active':''}" id="mij-toggle-pill" data-val="${listFilter==='mij'?'alle':'mij'}">${listFilter==='mij' ? '✓ Voor mij' : 'Voor mij'}</span>
    </div>
    <div class="pillgroup" id="scope-filter-pills" style="margin-bottom:10px">
      <span class="pill ${dateScope==='vandaag'?'active':''}" data-val="vandaag">Vandaag</span>
      <span class="pill ${dateScope==='morgen'?'active':''}" data-val="morgen">Morgen</span>
      <span class="pill ${dateScope==='komende'?'active':''}" data-val="komende">Komende dagen</span>
    </div>
    <div class="pillgroup" id="type-filter-pills" style="margin-bottom:16px">
      <span class="pill ${showLeveringen?'active':''}" data-val="leveringen">Leveringen</span>
      <span class="pill ${showAfhalingen?'active':''}" data-val="afhalingen">Afhalingen</span>
    </div>
    ${(dateScope==='komende' && currentUser.rol !== 'admin') ? `<div class="queue-note" style="margin-bottom:16px;text-align:left">Je ziet hier de planning tot en met de komende week. Voor de volledige planning: vraag de admin.</div>` : ''}
  `;
  let visible = listFilter === 'mij'
    ? deliveries.filter(d => isAssignedToMe(d.toegewezenAan) || isAssignedToMe(d.toegewezenAanAfhaling))
    : deliveries;

  if(deliveries.length === 0){
    return vehicleOccupancyPanel + `<div class="empty">
      <div class="big">Nog geen leveringen</div>
      Voeg een levering toe via "Nieuw" onderaan.
    </div>`;
  }

  renderedSections = {};
  const groups = {};
  function ensureGroup(key){
    if(!groups[key]) groups[key] = { teLeveren:[], geleverdKlaar:[], opTeHalen:[], afgerond:[], nogNietKlaar:[] };
    return groups[key];
  }
  visible.forEach(d=>{
    if(d.datum){
      const g = ensureGroup(d.datum);
      if(d.status === 'te-leveren') g.teLeveren.push(d);
      else g.geleverdKlaar.push(d); // reeds geleverd (geplaatst of afgerond)
    }
    if(d.status === 'geplaatst' || d.status === 'afgerond'){
      const afhaalKey = d.afhaaldatum || d.datum;
      if(afhaalKey){
        const g = ensureGroup(afhaalKey);
        if(d.status === 'geplaatst') g.opTeHalen.push(d);
        else g.afgerond.push(d);
      }
    } else if(d.status === 'te-leveren'){
      // Levering nog niet gebeurd: toon de geplande afhaling toch al, maar duidelijk als nog niet klaar
      const afhaalKey = d.afhaaldatum || d.datum;
      if(afhaalKey){
        ensureGroup(afhaalKey).nogNietKlaar.push(d);
      }
    }
  });

  // Welke datumsleutels mogen we tonen, op basis van de gekozen periode?
  let allowedDateKeys = null; // null = geen beperking (behalve evt. weekgrens hieronder)
  if(dateScope === 'vandaag'){
    allowedDateKeys = new Set([todayISO()]);
  } else if(dateScope === 'morgen'){
    const morgen = new Date(); morgen.setDate(morgen.getDate()+1);
    allowedDateKeys = new Set([morgen.toISOString().slice(0,10)]);
  }
  const weekCutoff = (!allowedDateKeys && currentUser.rol !== 'admin') ? weekCutoffISO() : null;

  let html = vehicleOccupancyPanel + filterBar;
  let anyDayShown = false;
  Object.keys(groups).sort().forEach(dateKey=>{
    if(allowedDateKeys && !allowedDateKeys.has(dateKey)) return;
    if(weekCutoff && dateKey > weekCutoff) return;

    let { teLeveren, geleverdKlaar, opTeHalen, afgerond, nogNietKlaar } = groups[dateKey];
    teLeveren = [...teLeveren].sort((a,b)=> sortKeyFor(a,'tijdslot') - sortKeyFor(b,'tijdslot'));
    geleverdKlaar = [...geleverdKlaar].sort((a,b)=> sortKeyFor(a,'tijdslot') - sortKeyFor(b,'tijdslot'));
    opTeHalen = [...opTeHalen].sort((a,b)=> sortKeyFor(a,'afhaaltijd') - sortKeyFor(b,'afhaaltijd'));
    afgerond = [...afgerond].sort((a,b)=> sortKeyFor(a,'afhaaltijd') - sortKeyFor(b,'afhaaltijd'));
    nogNietKlaar = [...nogNietKlaar].sort((a,b)=> sortKeyFor(a,'afhaaltijd') - sortKeyFor(b,'afhaaltijd'));

    if(!showLeveringen){ teLeveren = []; geleverdKlaar = []; }
    if(!showAfhalingen){ opTeHalen = []; afgerond = []; nogNietKlaar = []; }

    if(teLeveren.length === 0 && geleverdKlaar.length === 0 && opTeHalen.length === 0 && afgerond.length === 0 && nogNietKlaar.length === 0) return;
    anyDayShown = true;

    const teLeverenKey = dateKey + '|te-leveren';
    const opTeHalenKey = dateKey + '|geplaatst';
    renderedSections[teLeverenKey] = teLeveren.map(d=>d.id);
    renderedSections[opTeHalenKey] = opTeHalen.map(d=>d.id);

    html += `<div class="day-group"><h2>${dateKey===todayISO() ? 'Vandaag — ' : ''}${fmtDate(dateKey)}</h2>`;

    if(showAfhalingen && teLeveren.length === 0 && opTeHalen.length > 0){
      const eerste = opTeHalen[0];
      html += `<div class="next-pickup-banner">🕐 Alle leveringen gebeurd — eerstvolgende afhaling: <b>${escapeHtml(eerste.afhaaltijd || '?')} bij ${escapeHtml(eerste.klant)}</b></div>`;
    }

    if(teLeveren.length){
      html += `<div class="section-label te-leveren-label">Te leveren</div>`;
      teLeveren.forEach(d => html += cardHtml(d, teLeverenKey));
    }
    if(geleverdKlaar.length){
      html += `<div class="section-label geleverd-label">Geleverd</div>`;
      geleverdKlaar.forEach(d => html += deliveredCardHtml(d));
    }
    if(opTeHalen.length){
      html += `<div class="section-label op-te-halen-label">Op te halen</div>`;
      opTeHalen.forEach(d => html += cardHtml(d, opTeHalenKey));
    }
    if(nogNietKlaar.length){
      html += `<div class="section-label" style="color:var(--text-dim)"><span style="width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line);margin-right:6px"></span>Op te halen (nog niet klaar)</div>`;
      nogNietKlaar.forEach(d => html += notReadyCardHtml(d));
    }
    if(afgerond.length){
      html += `<div class="section-label afgerond-label">Afgerond</div>`;
      afgerond.forEach(d => html += cardHtml(d, ''));
    }
    html += `</div>`;
  });
  if(!anyDayShown){
    html += `<div class="empty"><div class="big">Niets gevonden</div>Probeer een andere filtercombinatie.</div>`;
  }
  return html;
}
async function requestDeleteDelivery(id, klant){
  if(!confirm('Reservatie van ' + (klant||'deze klant') + ' definitief verwijderen? Dit kan niet ongedaan gemaakt worden.')) return false;
  try{
    await apiFetch('/api/deliveries/' + id, { method:'DELETE' });
    const idx = deliveries.findIndex(x => x.id === id);
    if(idx !== -1) deliveries.splice(idx,1);
    persistedIds.delete(id);
    showToast('Reservatie verwijderd');
    return true;
  }catch(err){
    showToast(err.message);
    return false;
  }
}
function moveCard(sectionKey, id, dir){
  const order = renderedSections[sectionKey];
  if(!order) return;
  const idx = order.indexOf(id);
  const swapWith = dir === 'up' ? idx - 1 : idx + 1;
  if(idx < 0 || swapWith < 0 || swapWith >= order.length) return;
  [order[idx], order[swapWith]] = [order[swapWith], order[idx]];
  const changed = [];
  order.forEach((did, i)=>{
    const d = getDelivery(did);
    if(d && d.handmatigeVolgorde !== i){
      d.handmatigeVolgorde = i;
      changed.push(d);
    }
  });
  render();
  Promise.all(changed.map(d => saveDeliveries(d).catch(err=>showToast(err.message))));
}

function bindNewFormEvents(){
  const importBtn = document.getElementById('import-btn');
  if(importBtn){
    importBtn.addEventListener('click', ()=> document.getElementById('import-file').click());
    document.getElementById('import-file').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const resultEl = document.getElementById('import-result');
      resultEl.textContent = 'Bezig met importeren...';
      try{
        const fileBase64 = await new Promise((resolve, reject)=>{
          const reader = new FileReader();
          reader.onload = ()=> resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const r = await apiFetch('/api/import', { method:'POST', body: JSON.stringify({ fileBase64 }) });
        let msg = r.imported + ' nieuwe levering(en) toegevoegd';
        if(r.updated) msg += ', ' + r.updated + ' bestaande bijgewerkt (via boekingsnummer)';
        msg += '.';
        if(r.skipped && r.skipped.length){
          msg += ' ' + r.skipped.length + ' rij(en) overgeslagen: ' + r.skipped.map(s=>'rij '+s.rij+' ('+s.reden+')').join(', ');
        }
        resultEl.textContent = msg;
        showToast('Import voltooid');
        await loadDeliveries();
      }catch(err){
        resultEl.textContent = 'Import mislukt: ' + err.message;
      }
      e.target.value = '';
    });
  }

  document.getElementById('save-new').addEventListener('click', async ()=>{
    const klant = document.getElementById('f-klant').value.trim();
    const adres = document.getElementById('f-adres').value.trim();
    if(!klant || !adres){ showToast('Naam en adres zijn verplicht'); return; }
    const d = emptyDelivery();
    d.klant = klant;
    d.telefoon = document.getElementById('f-telefoon').value.trim();
    d.email = document.getElementById('f-email').value.trim();
    d.adres = adres;
    d.datum = document.getElementById('f-datum').value || todayISO();
    d.tijdslot = document.getElementById('f-tijdslot').value.trim();
    d.artikelen = document.getElementById('f-artikelen').value.trim();
    d.afhaaldatum = document.getElementById('f-afhaaldatum').value;
    d.afhaaltijd = document.getElementById('f-afhaaltijd').value;
    d.ondergrond = document.getElementById('f-ondergrond').value;
    if(d.ondergrond === 'Harde ondergrond') d.plaatsing.valmatten = true;
    d.plaatsing.tijdstip = d.afhaaltijd;
    deliveries.push(d);
    try{
      await saveDeliveries(d);
      showToast('Levering toegevoegd');
      setView('detail', d.id);
    }catch(err){
      deliveries.pop();
      showToast(err.message);
    }
  });
}

function pill(value, label, current){
  return `<span class="pill ${current===value?'active':''}" data-val="${value}">${label}</span>`;
}

function checkRow(id, label, sub, checked){
  return `<div class="check-row">
    <div><div class="txt">${label}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>
    <div class="toggle ${checked?'on':''}" id="${id}" data-checked="${checked?1:0}"><div class="knob"></div></div>
  </div>`;
}

async function refreshPhotoGrid(id){
  const grid = document.getElementById('photos-grid');

  const photos = await loadPhotos(id);
  grid.innerHTML = photos.map((p)=>`
    <div class="photo-thumb"><img src="${p.dataUrl}"><div class="rm" data-id="${p.id}">✕</div></div>
  `).join('') + '<div class="add-photo" id="add-photo-btn">+</div>';
  document.getElementById('add-photo-btn').addEventListener('click', ()=> document.getElementById('photo-input').click());
  grid.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      try{
        await removePhotoRemote(id, btn.dataset.id);
      }catch(err){ showToast(err.message); }
      refreshPhotoGrid(id);
    });
  });
}

function resizeImageFile(file, maxWidth=900, quality=0.62){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

}
function collectFromForm(d){
  const datumEl = document.getElementById('edit-datum');
  const tijdslotEl = document.getElementById('edit-tijdslot');
  if(datumEl) d.datum = datumEl.value || d.datum;
  if(tijdslotEl) d.tijdslot = tijdslotEl.value;

  d.afhaaldatum = document.getElementById('afhaaldatum').value;
  d.afhaaltijd = document.getElementById('afhaaltijd').value;

  d.plaatsing.correctGeplaatst = checkedVal('chk-correct');
  const bevestigingActive = document.querySelector('#bevestiging-pills .pill.active');
  d.plaatsing.bevestiging = bevestigingActive ? bevestigingActive.dataset.val : '';
  d.plaatsing.valmatten = checkedVal('chk-valmatten');
  d.plaatsing.verlengkabel = checkedVal('chk-kabel');
  const aantalKabelsEl = document.getElementById('aantal-kabels');
  d.plaatsing.aantalKabels = aantalKabelsEl ? aantalKabelsEl.value : d.plaatsing.aantalKabels;
